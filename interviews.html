<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>יומן ראיונות התאמה · מועדון האיקומרס</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f1e7;--surface:#fffdf9;--surface2:#f3ede1;--surface3:#e8e0cf;--border:rgba(70,55,30,0.13);--text:#1f1a13;--text-muted:#6b6355;--accent:#7c3aed;--accent2:#ec4899;--green:#0f9d6e;--orange:#d97706;--red:#dc2626}
  *{box-sizing:border-box}body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:900}header .role{font-size:12px;color:var(--text-muted)}.spacer{flex:1}
  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}.btn:hover{border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:default}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}.btn-sm{font-size:12px;padding:4px 9px}.btn.g{color:var(--green)}.btn.r{color:var(--red)}.btn.o{color:var(--orange)}.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:14px 16px;max-width:1500px;margin:0 auto}
  .title{font-size:13px;color:var(--text-muted);margin:0 0 10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .cday{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:230px;display:flex;flex-direction:column}.cday.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,58,237,.15)}.cday.past{opacity:.8}
  .cday .dh{font-weight:900;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:4px}.cday .dh small{font-weight:600;color:var(--text-muted)}.cday .dh .n{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-size:11px}
  .cday .add{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:900;font-size:15px;line-height:1;color:var(--accent);padding:0}.cday .add:hover{background:var(--accent);color:#fff}
  .hours{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--text-muted);background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:3px 5px;margin-bottom:6px;flex-wrap:wrap}.hours input{font:inherit;font-size:11px;padding:1px 3px;border:1px solid var(--border);border-radius:6px;background:var(--surface);width:64px;color:var(--text)}.hours.set{border-style:solid;border-color:rgba(15,157,110,.5);background:rgba(15,157,110,.06);color:var(--text)}.hours .x{cursor:pointer;color:var(--text-muted);margin-right:auto}
  .cev{background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--text-muted);border-radius:9px;padding:5px 7px;margin-top:5px;cursor:pointer;font-size:12px;line-height:1.35}.cev:hover{border-color:var(--accent)}
  .cev.g{border-right-color:var(--green)}.cev.o{border-right-color:var(--orange)}.cev.r{border-right-color:var(--red)}.cev.pending{border-style:dashed;opacity:.8}
  .cev.missed{background:rgba(220,38,38,.10);border-color:var(--red);border-right-color:var(--red);animation:pulse 1.6s infinite}.cev.closed{background:rgba(15,157,110,.10);border-right-color:var(--green)}.cev.failed{opacity:.55;border-right-color:var(--text-muted)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.25)}50%{box-shadow:0 0 0 4px rgba(220,38,38,0)}}
  .cev .t{font-weight:900;display:flex;justify-content:space-between}.cev .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cev .m{color:var(--text-muted);font-size:11px;display:flex;justify-content:space-between;gap:4px}.cev .tag{font-size:10.5px;font-weight:800}
  .outside{margin-top:8px;border-top:1px dashed var(--orange);padding-top:4px;font-size:11px;color:var(--orange);font-weight:800}
  .cday .none{color:var(--text-muted);font-size:11.5px;text-align:center;padding:14px 0}
  .pend{background:var(--surface);border:1px solid var(--orange);border-radius:14px;padding:10px 12px;margin-bottom:14px}.pend h2{font-size:14px;margin:0 0 8px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}.prow:first-of-type{border-top:none}.prow .who{font-weight:800}.prow .sub{font-size:12px;color:var(--text-muted)}.prow .acts{display:flex;gap:5px;flex-wrap:wrap}
  .gate{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center}.gate input{font:inherit;font-size:18px;text-align:center;letter-spacing:3px;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;margin:12px 0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}.modal.show{display:flex}.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(700px,100%);max-height:92vh;overflow:auto;padding:14px 16px}
  .card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.45}.card b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:2px}.hint{font-size:12px;color:var(--text-muted)}
  .chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;border:1px solid var(--border)}.chip.approved{color:var(--green)}.chip.pending{color:var(--orange)}.chip.rejected,.chip.moved{color:var(--red)}.chip.closed{background:rgba(15,157,110,.12);color:var(--green)}.chip.failed{color:var(--text-muted)}.chip.missed{background:rgba(220,38,38,.12);color:var(--red)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f1a13;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:30}
  .ftab{width:100%;border-collapse:collapse;font-size:12.5px}.ftab th{text-align:right;color:var(--text-muted);font-weight:700;padding:4px 6px 4px 0;vertical-align:top;width:42%;border-top:1px dashed var(--border)}.ftab td{padding:4px 0;border-top:1px dashed var(--border);vertical-align:top;white-space:pre-wrap}.ftab tr:first-child th,.ftab tr:first-child td{border-top:none}
  .field{display:grid;gap:3px;margin-top:8px;font-size:12.5px}.field input,.field textarea,.field select{font:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);width:100%}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .outc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.outc button{padding:10px 6px;font-size:13px}.ofrm{display:none;margin-top:8px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px}.ofrm.show{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}.kpi .v{font-size:26px;font-weight:900;line-height:1.1}.kpi .l{font-size:11.5px;color:var(--text-muted);font-weight:700}.kpi.g .v{color:var(--green)}.kpi.r .v{color:var(--red)}.kpi.o .v{color:var(--orange)}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}.tbl th{background:var(--surface2);font-size:11.5px;color:var(--text-muted);padding:7px 8px;text-align:right}.tbl td{padding:7px 8px;border-top:1px solid var(--border)}.tbl td.n{font-weight:800}.bar{height:7px;background:var(--surface3);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--green)}
  .sec{margin-top:16px}.sec h3{font-size:14px;margin:0 0 6px}
  @media(max-width:900px){.calgrid{grid-template-columns:1fr}.cday{min-height:0}.outc{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>📅 יומן ראיונות התאמה</h1><span class="role" id="roleTag"></span>
  <span class="spacer"></span>
  <span id="views" style="display:none"><button class="btn btn-sm on" data-v="cal">📅 יומן</button><button class="btn btn-sm" data-v="dash">📊 דשבורד</button></span>
  <span id="nav"><button class="btn" id="prev">◀ שבוע קודם</button><button class="btn" id="today">השבוע</button><button class="btn" id="next">שבוע הבא ▶</button></span><button class="btn" id="reload" title="רענן">🔄</button><button class="btn btn-sm" id="logout">יציאה</button>
</header>
<main>
  <div class="gate" id="gate">
    <div style="font-size:34px">🔐</div>
    <div style="font-weight:900;font-size:16px">יומן ראיונות ההתאמה</div>
    <div class="hint">הזן סיסמה. סיסמת מנהל המסלול פותחת גם את האישורים והדשבורד.</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" autofocus>
    <button class="btn btn-primary" id="enter" style="width:100%">כניסה</button>
    <div class="hint" id="gateErr" style="color:var(--red);margin-top:8px"></div>
  </div>
  <div id="app" style="display:none">
    <div id="calView">
      <div class="pend" id="pend" style="display:none"></div>
      <div class="title" id="title"></div>
      <div class="calgrid" id="grid"></div>
      <div class="hint" style="margin-top:10px" id="foot"></div>
    </div>
    <div id="dashView" style="display:none"></div>
  </div>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('show')"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<script>
const API='https://livecoach-data.aviv1988.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QLAB=[["why_now","מה גרם לך להתעניין דווקא עכשיו?"],["exp","מה הניסיון שלך באיקומרס ובדרופשיפינג?"],["content","עקב אחרי התכנים של אביב?"],["age","גיל הלקוח"],["job","תחום העיסוק והתפקיד היום"],["missing","מה חסר לו כדי להקים חנות דיגיטלית"],["budget","כמה מוכן להשקיע במותג"],["business","מבין שזה עסק ולא הכנסה פסיבית?"],["commit","כמה בטוח שמוכן להשקיע בהכשרה"],["ready","מוכן לראיון התאמה?"],["meet_day","יום הראיון"],["meet_time","שעת הראיון"],["verdict","סיווג הנציג והשלב הבא"],["notes","הערות ודפוסים"]];
function formTable(f){ f=f||{}; const rows=QLAB.filter(([k])=>String(f[k]||'').trim()); const extra=Object.keys(f).filter(k=>!QLAB.some(([q])=>q===k)&&!['name','phone','_ivId'].includes(k)&&String(f[k]||'').trim()); const all=rows.concat(extra.map(k=>[k,k])); if(!all.length) return '<div class="hint">אין תשובות מטופס (הוזן ידנית או שהנציג עוד לא מילא)</div>'; return `<div class="hint" style="margin-bottom:4px">ענה על ${rows.length} מתוך ${QLAB.length} שאלות</div><table class="ftab">${all.map(([k,l])=>`<tr><th>${esc(l)}</th><td>${esc(f[k])}</td></tr>`).join('')}</table>`; }
const HEB=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const ST={pending:'ממתין לאישור',approved:'מאושר',rejected:'אין אישור',moved:'עבר לאיש מכירות אחר'};
const OUT={closed:'✅ נסגר',failed:'❌ לא נסגר',rescheduled:'📅 נדחה'};
let PW='',ROLE='',WEEK=0,ROWS=[],PENDING=[],HOURS={},VIEW='cal',RANGE=90;
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2800); }
function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()+off*7); return d; }
const dayKey=d=>{ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
const fmt=d=>d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'});
const hm=iso=>new Date(iso).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const full=iso=>new Date(iso).toLocaleString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const money=n=>'₪'+Math.round(Number(n)||0).toLocaleString('he-IL');
const dl=d=>{ const x=new Date(d); return new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,16); };
const isMissed=x=>x.status==='approved'&&!x.outcome&&new Date(x.meet_at).getTime()<Date.now()-15*60000;
const fitCls=sc=>sc==null?'':sc>=75?'g':sc>=50?'o':'r';
async function api(path,opt={}){ let r; try{ r=await fetch(API+path,{...opt,headers:{'x-cal-pw':PW,'content-type':'application/json',...(opt.headers||{})}}); }
  catch(e){ try{ r=await fetch(API+path+(path.includes('?')?'&':'?')+'pw='+encodeURIComponent(PW),{method:opt.method||'GET',body:opt.body}); }catch(e2){ throw new Error('אין חיבור לשרת הנתונים. בדוק אינטרנט, או פתח את הלינק בכרום רגיל (לא בדפדפן של וואטסאפ/אינסטגרם).'); } }
  if(r.status===401) throw new Error('סיסמה שגויה (הוזנו '+PW.length+' תווים). הסיסמה היא 6 ספרות בלי רווחים.'); if(!r.ok){ let t=''; try{ t=(await r.json()).error||''; }catch(e){} throw new Error(t||('שגיאת שרת '+r.status)); } return r.json(); }
async function load(){ const from=new Date(Date.now()-RANGE*864e5).toISOString(); const to=new Date(Date.now()+180*864e5).toISOString();
  const j=await api('/cal/list?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)); ROLE=j.role; ROWS=j.rows||[]; PENDING=j.pending||[]; HOURS={}; for(const h of (j.hours||[])) HOURS[h.day]=h;
  $('roleTag').textContent=ROLE==='admin'?'👑 מנהל המסלול: אישורים, שעות, תוצאות ודשבורד':'👥 המראיין: שעות העבודה, הראיונות והתוצאות'; $('views').style.display=ROLE==='admin'?'':'none'; render(); }
function hoursOf(dk){ const h=HOURS[dk]; return h&&(h.start_t||h.end_t)?h:null; }
function inHours(x,h){ if(!h||!h.start_t||!h.end_t) return true; const t=hm(x.meet_at); return t>=h.start_t&&t<=h.end_t; }
function evCard(x){ const sc=x.fit; const missed=isMissed(x); const c=x.outcome==='closed'?'closed':x.outcome==='failed'?'failed':missed?'missed':x.status!=='approved'?x.status:fitCls(sc);
  const tag=x.outcome==='closed'?'✅ נסגר '+money(x.amount):x.outcome==='failed'?'❌ '+esc((x.outcome_reason||'').slice(0,18)):missed?'⏰ עבר הזמן, עדכן!':x.status==='pending'?'⏳ ממתין לאישור':x.source==='manual'?'✍️ ידני':esc((x.verdict||'').split(/[:.]/)[0].slice(0,14));
  return `<div class="cev ${c}" onclick="open_('${x.id}')"><div class="t"><span>🕒 ${hm(x.meet_at)}</span>${sc!=null?`<span>${sc}/100</span>`:''}</div><div class="nm">${esc(x.name||x.phone||'ליד')}</div><div class="m"><span>👤 ${esc(x.rep||'')}</span><span class="tag">${tag}</span></div></div>`; }
function render(){ $('calView').style.display=VIEW==='cal'?'':'none'; $('dashView').style.display=VIEW==='dash'?'':'none'; $('nav').style.display=VIEW==='cal'?'':'none'; if(VIEW==='dash'){ renderDash(); return; }
  const ws=weekStart(WEEK); const we=new Date(ws.getTime()+7*864e5); const today=new Date().toDateString();
  const shown=ROWS.filter(x=>{ const t=new Date(x.meet_at).getTime(); return t>=ws.getTime()&&t<we.getTime()&&(x.status==='approved'||(ROLE==='admin'&&x.status==='pending')); });
  const missedAll=ROWS.filter(isMissed).length;
  $('title').innerHTML=`<b>${fmt(ws)} – ${fmt(new Date(we.getTime()-1))}</b> · ${shown.filter(x=>x.status==='approved'&&!x.outcome).length} ראיונות פתוחים השבוע${missedAll?' · <b style="color:var(--red)">'+missedAll+' עברו את זמנם בלי עדכון</b>':''}${WEEK===0?' · <b style="color:var(--accent)">השבוע הנוכחי</b>':WEEK>0?' · בעוד '+WEEK+' שבועות':' · לפני '+(-WEEK)+' שבועות'}`;
  let h=''; for(let i=0;i<7;i++){ const d=new Date(ws.getTime()+i*864e5); const dk=dayKey(d); const hrs=hoursOf(dk); const evs=shown.filter(x=>new Date(x.meet_at).toDateString()===d.toDateString()).sort((a,b)=>new Date(a.meet_at)-new Date(b.meet_at)); const inside=evs.filter(x=>inHours(x,hrs)), outside=evs.filter(x=>!inHours(x,hrs)); const cls=d.toDateString()===today?'today':d.getTime()<Date.now()-864e5?'past':'';
    h+=`<div class="cday ${cls}"><div class="dh"><span>${HEB[d.getDay()]} <small>${fmt(d)}</small></span><span style="display:flex;gap:4px;align-items:center">${evs.length?`<span class="n">${evs.length}</span>`:''}<button class="add" title="הוסף ראיון ידני" onclick="addForm('${dk}')">+</button></span></div>
      <div class="hours ${hrs?'set':''}">🕘 <input type="time" value="${esc(hrs&&hrs.start_t||'')}" onchange="setHours('${dk}',this.value,null)" title="מתחיל"> – <input type="time" value="${esc(hrs&&hrs.end_t||'')}" onchange="setHours('${dk}',null,this.value)" title="מסיים">${hrs?`<span class="x" title="נקה שעות" onclick="setHours('${dk}','','')">✕</span>`:'<span style="font-size:10px">שעות עבודה</span>'}</div>
      ${inside.length?inside.map(evCard).join(''):(!outside.length?'<div class="none">אין ראיונות</div>':'')}${outside.length?`<div class="outside">⚠️ מחוץ לשעות העבודה (${outside.length})</div>`+outside.map(evCard).join(''):''}</div>`; }
  $('grid').innerHTML=h;
  if(ROLE==='admin'){ const p=$('pend'); p.style.display=''; if(PENDING.length){ p.innerHTML=`<h2>⏳ ממתינים לאישורך (${PENDING.length})</h2>`+PENDING.map(x=>`<div class="prow"><div><div class="who">${esc(x.name||x.phone||'ליד')} <span class="hint">· ${esc(x.rep||'')}</span> ${x.fit!=null?`<span class="chip ${x.fit>=75?'approved':x.fit>=50?'pending':'rejected'}">${x.fit}/100</span>`:''}</div><div class="sub">🕒 ${full(x.meet_at)}${x.verdict?' · '+esc(x.verdict):''}${x.sent_at?' · ✉️ ההודעה נשלחה ללקוח':' · ✉️ ההודעה עוד לא נשלחה'}</div>${(()=>{ const f=x.form||{}; const p=[['job','עיסוק'],['budget','תקציב'],['why_now','למה עכשיו'],['commit','מחויבות']].filter(([k])=>String(f[k]||'').trim()).map(([k,l])=>`<b>${l}:</b> ${esc(String(f[k]).slice(0,60))}`); return p.length?`<div class="sub">${p.join(' · ')}</div>`:''; })()}</div><div class="acts"><button class="btn btn-sm" onclick="open_('${x.id}')">פרטים</button><button class="btn btn-sm g" onclick="decide('${x.id}','approved')">✅ אשר</button><button class="btn btn-sm r" onclick="decide('${x.id}','rejected')">❌ אין אישור</button><button class="btn btn-sm o" onclick="decide('${x.id}','moved')">↪️ עבר לאיש מכירות אחר</button></div></div>`).join(''); } else p.innerHTML='<h2>✅ אין ראיונות שממתינים לאישור</h2>'; }
  else $('pend').style.display='none';
  $('foot').innerHTML='🕘 בכל יום מסמנים מאיזו שעה עד איזו שעה עובדים. ראיון מחוץ לשעות מוצג בנפרד עם ⚠️. <b>+</b> מוסיף ראיון ידני. ראיון שעבר זמנו בלי עדכון נצבע <b style="color:var(--red)">אדום</b> עד שמעדכנים: נדחה (מועד חדש), לא נסגר (חובה סיבה) או נסגר (חובה סכום). צבע: ירוק 75+, כתום 50-74, אדום מתחת.';
}
window.setHours=async(dk,st,en)=>{ const cur=HOURS[dk]||{}; const start_t=st==null?(cur.start_t||''):st, end_t=en==null?(cur.end_t||''):en; try{ await api('/cal/hours',{method:'POST',body:JSON.stringify({day:dk,start_t,end_t})}); if(!start_t&&!end_t) delete HOURS[dk]; else HOURS[dk]={day:dk,start_t,end_t}; render(); toast(start_t||end_t?'שעות העבודה נשמרו':'השעות נוקו'); }catch(e){ toast('שגיאה: '+e.message); } };
window.addForm=dk=>{ $('box').innerHTML=`<div style="display:flex;align-items:center;gap:8px"><b style="font-size:16px">✍️ ראיון ידני · ${HEB[new Date(dk+'T00:00:00').getDay()]} ${fmt(new Date(dk+'T00:00:00'))}</b><span class="spacer"></span><button class="btn btn-sm" onclick="$('modal').classList.remove('show')">✕</button></div>
  <div class="row2"><label class="field">שם הלקוח<input id="a_name" placeholder="שם מלא"></label><label class="field">טלפון<input id="a_phone" inputmode="tel" placeholder="050-000-0000"></label></div>
  <div class="row2"><label class="field">שעה<input id="a_time" type="time" value="${(HOURS[dk]&&HOURS[dk].start_t)||'10:00'}"></label><label class="field">מי קבע (נציג)<input id="a_rep" placeholder="ידני"></label></div>

  <div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-primary" onclick="addSave('${dk}')">➕ הוסף ליומן</button></div>`; $('modal').classList.add('show'); setTimeout(()=>$('a_name').focus(),50); };
window.addSave=async dk=>{ const name=$('a_name').value.trim(), phone=$('a_phone').value.trim(), t=$('a_time').value; if(!name&&!phone) return toast('צריך לפחות שם או טלפון'); if(!t) return toast('בחר שעה'); const meet=new Date(dk+'T'+t+':00'); try{ await api('/cal/add',{method:'POST',body:JSON.stringify({name,phone,meet_at:meet.toISOString(),label:HEB[meet.getDay()]+' '+fmt(meet)+' '+t,rep:$('a_rep').value.trim()||'ידני',notes:$('a_notes').value.trim()})}); $('modal').classList.remove('show'); toast('נוסף ליומן'); await load(); }catch(e){ toast('שגיאה: '+e.message); } };
window.open_=id=>{ const x=ROWS.find(r=>r.id===id)||PENDING.find(r=>r.id===id); if(!x) return; const f=x.form||{}; const wa=x.phone?'https://wa.me/'+String(x.phone).replace(/\D/g,'').replace(/^0/,'972'):''; const missed=isMissed(x);
  const hist=(x.history||[]).slice().reverse().map(e=>`<div>${new Date(e.at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${e.what==='rescheduled'?'נדחה מ-'+hm(e.from)+' '+fmt(new Date(e.from))+' ל-'+full(e.to)+(e.reason?' ('+esc(e.reason)+')':''):e.what==='failed'?'לא נסגר: '+esc(e.reason):e.what==='closed'?'נסגר ב-'+money(e.amount)+(e.reason?' ('+esc(e.reason)+')':''):'נפתח מחדש'}</div>`).join('');
  $('box').innerHTML=`<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:16px">🎯 ${esc(x.name||x.phone||'ליד')}</b><span class="chip ${x.status}">${ST[x.status]||x.status}</span>${x.outcome?`<span class="chip ${x.outcome}">${OUT[x.outcome]}${x.outcome==='closed'?' '+money(x.amount):''}</span>`:missed?'<span class="chip missed">⏰ עבר הזמן, חובה לעדכן</span>':''}<span class="spacer"></span><button class="btn btn-sm" onclick="$('modal').classList.remove('show')">✕</button></div>
  <div class="card"><b>מועד הראיון</b>🕒 ${full(x.meet_at)} · נציג: ${esc(x.rep||'')}${x.source==='manual'?' · ✍️ הוזן ידנית':''}${wa?` · <a href="${wa}" target="_blank">🟢 ${esc(x.phone)}</a>`:''}${x.source!=='manual'?(x.sent_at?'<br>✉️ הודעת האישור נשלחה ללקוח '+new Date(x.sent_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'<br>✉️ הודעת האישור עוד לא נשלחה ללקוח'):''}${x.notes?'<br>📝 '+esc(x.notes):''}</div>
  ${x.status==='approved'?`<div class="card"><b>עדכון תוצאה</b>${x.outcome?`<div class="hint">התוצאה: ${OUT[x.outcome]}${x.outcome_reason?' · '+esc(x.outcome_reason):''}${x.amount?' · '+money(x.amount):''} <button class="btn btn-sm" onclick="outcome('${x.id}','reopen')">↩️ פתח מחדש</button></div>`:''}
    <div class="outc"><button class="btn o" onclick="oform('resched')">📅 נדחה למועד אחר</button><button class="btn r" onclick="oform('failed')">❌ לא נסגר</button><button class="btn g" onclick="oform('closed')">✅ נסגר</button></div>
    <div class="ofrm" id="of_resched"><div class="row2"><label class="field">מועד חדש<input id="o_when" type="datetime-local" value="${dl(new Date(Math.max(Date.now()+3600e3,new Date(x.meet_at).getTime())))}"></label><label class="field">סיבת הדחייה (לא חובה)<input id="o_rreason" placeholder="לא ענה / ביקש מחר…"></label></div><button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="outcome('${x.id}','rescheduled')">שמור מועד חדש</button></div>
    <div class="ofrm" id="of_failed"><label class="field">למה לא נסגר? (חובה)<select id="o_fsel" onchange="$('o_freason').value=this.value==='אחר'?'':this.value"><option value="">בחר סיבה…</option><option>לא ענה / לא הגיע</option><option>לא רלוונטי: אין תקציב</option><option>לא רלוונטי: אין זמן</option><option>לא מחויב / מתלבט</option><option>בן/בת זוג מתנגדים</option><option>מחיר</option><option>יחזור אלינו בהמשך</option><option>אחר</option></select><input id="o_freason" placeholder="פרט בכמה מילים"></label><button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="outcome('${x.id}','failed')">שמור: לא נסגר</button></div>
    <div class="ofrm" id="of_closed"><div class="row2"><label class="field">סכום העסקה בש״ח (חובה)<input id="o_amount" type="number" inputmode="numeric" min="1" placeholder="למשל 14900"></label><label class="field">מסלול / הערה<input id="o_creason" placeholder="לא חובה"></label></div><button class="btn btn-primary btn-sm" style="margin-top:6px" onclick="outcome('${x.id}','closed')">שמור: נסגר</button></div></div>`:''}
  ${x.fit!=null?`<div class="card"><b>התאמה ${x.fit}/100</b>${esc(x.verdict||'')}</div>`:''}${x.summary?`<div class="card"><b>תמצית</b>${esc(x.summary)}</div>`:''}${x.note_to_manager?`<div class="card"><b>למנהל המסלול</b>${esc(x.note_to_manager)}</div>`:''}
  <div class="card"><b>📋 כל מה שהנציג מילא בטופס</b>${formTable(f)}</div>
  ${(x.criteria||[]).length?`<div class="card"><b>5 המדדים של הנציג</b>${x.criteria.map((c,i)=>`${i+1}. ${esc(c.name)}: <b style="display:inline;color:var(--text)">${c.score}/20</b>`).join('<br>')}</div>`:''}
  ${hist?`<div class="card"><b>היסטוריה</b>${hist}</div>`:''}${x.manager_note?`<div class="card"><b>הערת המנהל</b>${esc(x.manager_note)}</div>`:''}
  ${ROLE==='admin'?`<div class="card"><b>אישור</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><button class="btn btn-sm g" onclick="decide('${x.id}','approved')">✅ אשר</button><button class="btn btn-sm r" onclick="decide('${x.id}','rejected')">❌ אין אישור</button><button class="btn btn-sm o" onclick="decide('${x.id}','moved')">↪️ עבר לאיש מכירות אחר</button><button class="btn btn-sm" onclick="decide('${x.id}','pending')">⏳ החזר להמתנה</button></div><input id="note" placeholder="הערה (לא חובה)" value="${esc(x.manager_note||'')}" style="font:inherit;width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px"></div>`:''}`;
  $('modal').classList.add('show'); if(missed) oform('resched'); };
window.oform=k=>{ for(const id of ['of_resched','of_failed','of_closed']){ const el=$(id); if(el) el.classList.toggle('show',id==='of_'+k); } };
window.outcome=async(id,kind)=>{ const body={id,outcome:kind}; if(kind==='rescheduled'){ const v=$('o_when').value; if(!v) return toast('בחר מועד חדש'); const d=new Date(v); body.new_meet_at=d.toISOString(); body.label=HEB[d.getDay()]+' '+fmt(d)+' '+hm(d); body.reason=$('o_rreason').value.trim(); }
  if(kind==='failed'){ body.reason=$('o_freason').value.trim(); if(!body.reason) return toast('חובה לכתוב סיבה כדי שהראיון יירד מהיומן'); }
  if(kind==='closed'){ body.amount=Number($('o_amount').value); if(!(body.amount>0)) return toast('חובה להזין את סכום העסקה'); body.reason=$('o_creason').value.trim(); }
  try{ await api('/cal/outcome',{method:'POST',body:JSON.stringify(body)}); toast(kind==='closed'?'🎉 נסגר, כל הכבוד':kind==='failed'?'עודכן: לא נסגר':kind==='rescheduled'?'המועד עודכן':'נפתח מחדש'); $('modal').classList.remove('show'); await load(); }catch(e){ toast('שגיאה: '+e.message); } };
window.decide=async(id,status)=>{ try{ const note=$('note')?$('note').value.trim():''; await api('/cal/decide',{method:'POST',body:JSON.stringify({id,status,note})}); toast(status==='approved'?'אושר, נכנס ליומן':status==='pending'?'הוחזר להמתנה':'סומן: '+ST[status]); $('modal').classList.remove('show'); await load(); }catch(e){ toast('שגיאה: '+e.message); } };
/* ── manager dashboard: closing rate, relevance, amounts ── */
function renderDash(){ const since=Date.now()-RANGE*864e5; const all=ROWS.filter(x=>new Date(x.meet_at).getTime()>=since&&new Date(x.meet_at).getTime()<=Date.now()+864e5); const appr=all.filter(x=>x.status==='approved'); const closed=appr.filter(x=>x.outcome==='closed'), failed=appr.filter(x=>x.outcome==='failed'), missed=appr.filter(isMissed), open=appr.filter(x=>!x.outcome&&!isMissed(x)); const decided=closed.length+failed.length; const rate=decided?Math.round(closed.length/decided*100):0; const sum=closed.reduce((s,x)=>s+(+x.amount||0),0);
  const bucket=x=>x.fit==null?'ללא ציון':x.fit>=75?'רלוונטי (75+)':x.fit>=50?'בינוני (50-74)':'לא רלוונטי (מתחת 50)'; const groups=(arr,key)=>{ const g={}; for(const x of arr){ const k=key(x); (g[k]=g[k]||[]).push(x); } return g; };
  const tbl=(g,order)=>{ const keys=order||Object.keys(g).sort((a,b)=>g[b].length-g[a].length); return `<table class="tbl"><tr><th>קבוצה</th><th>ראיונות</th><th>נסגרו</th><th>לא נסגרו</th><th>אחוז סגירה</th><th></th><th>סכום</th><th>ממוצע לעסקה</th></tr>${keys.filter(k=>g[k]).map(k=>{ const a=g[k]; const c=a.filter(x=>x.outcome==='closed'), f=a.filter(x=>x.outcome==='failed'); const d=c.length+f.length; const r=d?Math.round(c.length/d*100):0; const s=c.reduce((z,x)=>z+(+x.amount||0),0); return `<tr><td class="n">${esc(k)}</td><td>${a.length}</td><td style="color:var(--green);font-weight:800">${c.length}</td><td>${f.length}</td><td class="n">${d?r+'%':'—'}</td><td><div class="bar"><i style="width:${r}%"></i></div></td><td>${money(s)}</td><td>${c.length?money(s/c.length):'—'}</td></tr>`; }).join('')}</table>`; };
  const reasons=groups(failed,x=>(x.outcome_reason||'לא צוין').split(/[:(]/)[0].trim()); const rk=Object.keys(reasons).sort((a,b)=>reasons[b].length-reasons[a].length).slice(0,8);
  $('dashView').innerHTML=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap"><b>📊 דשבורד סגירות</b><span class="hint">ראיונות מאושרים לפי מועד הראיון</span><span class="spacer"></span>${[30,90,180,365].map(n=>`<button class="btn btn-sm ${RANGE===n?'on':''}" onclick="RANGE=${n};load()">${n===365?'שנה':n+' ימים'}</button>`).join('')}</div>
  <div class="kpis"><div class="kpi"><div class="v">${appr.length}</div><div class="l">ראיונות מאושרים</div></div><div class="kpi g"><div class="v">${closed.length}</div><div class="l">נסגרו</div></div><div class="kpi"><div class="v">${failed.length}</div><div class="l">לא נסגרו</div></div><div class="kpi ${rate>=40?'g':rate>=25?'o':'r'}"><div class="v">${decided?rate+'%':'—'}</div><div class="l">אחוז סגירה (מתוך המוכרעים)</div></div><div class="kpi g"><div class="v" style="font-size:20px">${money(sum)}</div><div class="l">סה״כ סגירות${closed.length?' · ממוצע '+money(sum/closed.length):''}</div></div><div class="kpi r"><div class="v">${missed.length}</div><div class="l">עברו זמנם בלי עדכון</div></div><div class="kpi o"><div class="v">${open.length}</div><div class="l">פתוחים / עתידיים</div></div><div class="kpi"><div class="v">${PENDING.length}</div><div class="l">ממתינים לאישור</div></div></div>
  <div class="sec"><h3>🎯 לפי רלוונטיות (ציון ההתאמה של הנציג)</h3><div class="hint" style="margin-bottom:6px">כאן לומדים אם הציון מנבא סגירה: אם "לא רלוונטי" נסגרים בסכומים דומים, הסינון מחמיר מדי; אם "רלוונטי" לא נסגרים, הבעיה בראיון.</div>${tbl(groups(appr,bucket),['רלוונטי (75+)','בינוני (50-74)','לא רלוונטי (מתחת 50)','ללא ציון'])}</div>
  <div class="sec"><h3>👤 לפי נציג שקבע</h3>${tbl(groups(appr,x=>x.rep||'ללא שם'))}</div>
  <div class="sec"><h3>❌ למה לא נסגר</h3>${rk.length?`<table class="tbl"><tr><th>סיבה</th><th>כמות</th><th>מתוכם "רלוונטי 75+"</th></tr>${rk.map(k=>`<tr><td class="n">${esc(k)}</td><td>${reasons[k].length}</td><td>${reasons[k].filter(x=>x.fit>=75).length}</td></tr>`).join('')}</table>`:'<div class="hint">עדיין אין כישלונות מתועדים</div>'}</div>
  <div class="sec"><h3>💰 הסגירות</h3>${closed.length?`<table class="tbl"><tr><th>מתי</th><th>לקוח</th><th>נציג</th><th>ציון</th><th>סכום</th><th>הערה</th></tr>${closed.sort((a,b)=>new Date(b.outcome_at||b.meet_at)-new Date(a.outcome_at||a.meet_at)).map(x=>`<tr><td>${fmt(new Date(x.outcome_at||x.meet_at))}</td><td class="n"><a href="#" onclick="open_('${x.id}');return false">${esc(x.name||x.phone)}</a></td><td>${esc(x.rep||'')}</td><td>${x.fit!=null?x.fit:'—'}</td><td class="n">${money(x.amount)}</td><td>${esc(x.outcome_reason||'')}</td></tr>`).join('')}</table>`:'<div class="hint">עדיין אין סגירות מתועדות בטווח הזה</div>'}</div>`; }
async function enter(){ PW=$('pw').value.replace(/[^0-9A-Za-z]/g,''); if(!PW) return; $('enter').disabled=true; $('enter').textContent='בודק…'; $('gateErr').textContent=''; try{ await load(); sessionStorage.setItem('cal_pw',PW); $('gate').style.display='none'; $('app').style.display=''; }catch(e){ $('gateErr').textContent=e.message; } finally{ $('enter').disabled=false; $('enter').textContent='כניסה'; } }
$('enter').onclick=enter; $('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') enter(); });
$('prev').onclick=()=>{ WEEK--; render(); }; $('next').onclick=()=>{ WEEK++; render(); }; $('today').onclick=()=>{ WEEK=0; render(); }; $('reload').onclick=()=>load().then(()=>toast('עודכן')).catch(e=>toast(e.message));
$('views').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; VIEW=b.dataset.v; for(const x of $('views').querySelectorAll('button')) x.classList.toggle('on',x===b); render(); };
$('logout').onclick=()=>{ sessionStorage.removeItem('cal_pw'); location.reload(); };
(async()=>{ const saved=sessionStorage.getItem('cal_pw'); if(saved){ $('pw').value=saved; await enter(); } })();
setInterval(()=>{ if(ROLE) load().catch(()=>{}); },60000);
</script>
