<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>יומן ראיונות התאמה · מועדון האיקומרס</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f1e7;--surface:#fffdf9;--surface2:#f3ede1;--surface3:#e8e0cf;--border:rgba(70,55,30,0.13);--text:#1f1a13;--text-muted:#6b6355;--accent:#7c3aed;--accent2:#ec4899;--green:#0f9d6e;--orange:#d97706;--red:#dc2626}
  *{box-sizing:border-box}body{margin:0;font-family:Heebo,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:900}header .role{font-size:12px;color:var(--text-muted)}.spacer{flex:1}
  .btn{font-family:inherit;font-size:13px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}.btn:hover{border-color:var(--accent)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}.btn-sm{font-size:12px;padding:4px 9px}.btn.g{color:var(--green)}.btn.r{color:var(--red)}.btn.o{color:var(--orange)}
  main{padding:14px 16px;max-width:1500px;margin:0 auto}
  .title{font-size:13px;color:var(--text-muted);margin:0 0 10px}
  .calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .cday{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:200px}.cday.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(124,58,237,.15)}.cday.past{opacity:.75}
  .cday .dh{font-weight:900;font-size:12.5px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.cday .dh small{font-weight:600;color:var(--text-muted)}.cday .dh .n{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-size:11px}
  .cev{background:var(--surface);border:1px solid var(--border);border-right:4px solid var(--text-muted);border-radius:9px;padding:5px 7px;margin-top:5px;cursor:pointer;font-size:12px;line-height:1.35}.cev:hover{border-color:var(--accent)}
  .cev.g{border-right-color:var(--green)}.cev.o{border-right-color:var(--orange)}.cev.r{border-right-color:var(--red)}.cev.pending{border-style:dashed;opacity:.8}.cev.rejected,.cev.moved{opacity:.45;text-decoration:line-through}
  .cev .t{font-weight:900;display:flex;justify-content:space-between}.cev .nm{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cev .m{color:var(--text-muted);font-size:11px;display:flex;justify-content:space-between;gap:4px}
  .cday .none{color:var(--text-muted);font-size:11.5px;text-align:center;padding:14px 0}
  .pend{background:var(--surface);border:1px solid var(--orange);border-radius:14px;padding:10px 12px;margin-bottom:14px}.pend h2{font-size:14px;margin:0 0 8px}
  .prow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}.prow:first-of-type{border-top:none}.prow .who{font-weight:800}.prow .sub{font-size:12px;color:var(--text-muted)}.prow .acts{display:flex;gap:5px;flex-wrap:wrap}
  .gate{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center}.gate input{font:inherit;font-size:18px;text-align:center;letter-spacing:3px;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;margin:12px 0}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:12px;z-index:20}.modal.show{display:flex}.box{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:min(680px,100%);max-height:90vh;overflow:auto;padding:14px 16px}
  .card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px;line-height:1.45}.card b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:2px}.hint{font-size:12px;color:var(--text-muted)}
  .chip{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800;border:1px solid var(--border)}.chip.approved{color:var(--green)}.chip.pending{color:var(--orange)}.chip.rejected,.chip.moved{color:var(--red)}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1f1a13;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;display:none;z-index:30}
  .ftab{width:100%;border-collapse:collapse;font-size:12.5px}.ftab th{text-align:right;color:var(--text-muted);font-weight:700;padding:4px 6px 4px 0;vertical-align:top;width:42%;border-top:1px dashed var(--border)}.ftab td{padding:4px 0;border-top:1px dashed var(--border);vertical-align:top;white-space:pre-wrap}.ftab tr:first-child th,.ftab tr:first-child td{border-top:none}
  @media(max-width:900px){.calgrid{grid-template-columns:1fr}.cday{min-height:0}}
</style>
</head>
<body>
<header>
  <h1>📅 יומן ראיונות התאמה</h1><span class="role" id="roleTag"></span>
  <span class="spacer"></span>
  <button class="btn" id="prev">◀ שבוע קודם</button><button class="btn" id="today">השבוע</button><button class="btn" id="next">שבוע הבא ▶</button><button class="btn" id="reload" title="רענן">🔄</button><button class="btn btn-sm" id="logout">יציאה</button>
</header>
<main>
  <div class="gate" id="gate">
    <div style="font-size:34px">🔐</div>
    <div style="font-weight:900;font-size:16px">יומן ראיונות ההתאמה</div>
    <div class="hint">הזן סיסמה. סיסמת מנהל המסלול פותחת גם את האישורים.</div>
    <input id="pw" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" autofocus>
    <button class="btn btn-primary" id="enter" style="width:100%">כניסה</button>
    <div class="hint" id="gateErr" style="color:var(--red);margin-top:8px"></div>
  </div>
  <div id="app" style="display:none">
    <div class="pend" id="pend" style="display:none"></div>
    <div class="title" id="title"></div>
    <div class="calgrid" id="grid"></div>
    <div class="hint" style="margin-top:10px" id="foot"></div>
  </div>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('show')"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>
<script>
const API='https://livecoach-data.aviv1988.workers.dev';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const QLAB=[["why_now", "מה גרם לך להתעניין דווקא עכשיו?"], ["exp", "מה הניסיון שלך באיקומרס ובדרופשיפינג?"], ["content", "עקב אחרי התכנים של אביב?"], ["age", "טווח גילאים"], ["job", "תחום העיסוק והתפקיד היום"], ["missing", "מה חסר לו כדי להקים / להגדיל חנות"], ["budget", "כמה מוכן להשקיע במותג"], ["business", "מבין שזה עסק ולא הכנסה פסיבית?"], ["commit", "כמה בטוח שמוכן להשקיע בהכשרה"], ["ready", "מוכן לראיון התאמה?"], ["meet_day", "יום הראיון"], ["meet_time", "שעת הראיון"], ["verdict", "סיווג הנציג והשלב הבא"]];
function formTable(f){ f=f||{}; const rows=QLAB.filter(([k])=>String(f[k]||'').trim()); const extra=Object.keys(f).filter(k=>!QLAB.some(([q])=>q===k)&&!['name','phone','_ivId'].includes(k)&&String(f[k]||'').trim()); const all=rows.concat(extra.map(k=>[k,k])); if(!all.length) return '<div class="hint">הנציג עוד לא מילא שאלות</div>'; return `<div class="hint" style="margin-bottom:4px">ענה על ${rows.length} מתוך ${QLAB.length} שאלות</div><table class="ftab">${all.map(([k,l])=>`<tr><th>${esc(l)}</th><td>${esc(f[k])}</td></tr>`).join('')}</table>`; }
const HEB=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const ST={pending:'ממתין לאישור',approved:'מאושר',rejected:'אין אישור',moved:'עבר לאיש מכירות אחר'};
let PW='',ROLE='',WEEK=0,ROWS=[],PENDING=[];
function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display='none',2500); }
function weekStart(off){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()+off*7); return d; }
async function api(path,opt={}){ let r; try{ r=await fetch(API+path,{...opt,headers:{'x-cal-pw':PW,'content-type':'application/json',...(opt.headers||{})}}); }
  catch(e){ // some networks / in-app browsers strip custom headers or block the preflight: retry with the password in the query
    try{ r=await fetch(API+path+(path.includes('?')?'&':'?')+'pw='+encodeURIComponent(PW),{method:opt.method||'GET',body:opt.body}); }catch(e2){ throw new Error('אין חיבור לשרת הנתונים. בדוק אינטרנט, או פתח את הלינק בכרום רגיל (לא בדפדפן של וואטסאפ/אינסטגרם).'); } }
  if(r.status===401) throw new Error('סיסמה שגויה (הוזנו '+PW.length+' תווים). הסיסמה היא 6 ספרות בלי רווחים.'); if(!r.ok) throw new Error('שגיאת שרת '+r.status+': '+(await r.text()).slice(0,120)); return r.json(); }
async function load(){ const from=new Date(weekStart(WEEK).getTime()-60*864e5).toISOString(); const to=new Date(weekStart(WEEK).getTime()+120*864e5).toISOString();
  const j=await api('/cal/list?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)); ROLE=j.role; ROWS=j.rows||[]; PENDING=j.pending||[]; $('roleTag').textContent=ROLE==='admin'?'👑 מנהל המסלול: אתה מאשר מה נכנס ליומן':'👥 תצוגת אנשי מכירות: רק ראיונות שאושרו';
  render(); }
function fmt(d){ return d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'}); }
function render(){ const ws=weekStart(WEEK); const we=new Date(ws.getTime()+7*864e5); const today=new Date().toDateString();
  const inWeek=ROWS.filter(x=>{ const t=new Date(x.meet_at).getTime(); return t>=ws.getTime()&&t<we.getTime()&&(ROLE==='admin'||x.status==='approved'); });
  const shown=inWeek.filter(x=>x.status==='approved'||x.status==='pending');
  $('title').innerHTML=`<b>${fmt(ws)} – ${fmt(new Date(we.getTime()-1))}</b> · ${shown.filter(x=>x.status==='approved').length} ראיונות מאושרים השבוע${WEEK===0?' · <b style="color:var(--accent)">השבוע הנוכחי</b>':WEEK>0?' · בעוד '+WEEK+' שבועות':' · לפני '+(-WEEK)+' שבועות'}`;
  let h=''; for(let i=0;i<7;i++){ const d=new Date(ws.getTime()+i*864e5); const evs=shown.filter(x=>new Date(x.meet_at).toDateString()===d.toDateString()).sort((a,b)=>new Date(a.meet_at)-new Date(b.meet_at)); const cls=d.toDateString()===today?'today':d.getTime()<Date.now()-864e5?'past':'';
    h+=`<div class="cday ${cls}"><div class="dh"><span>${HEB[d.getDay()]} <small>${fmt(d)}</small></span>${evs.length?`<span class="n">${evs.length}</span>`:''}</div>${evs.length?evs.map(x=>{ const sc=x.fit; const c=x.status!=='approved'?x.status:sc==null?'':sc>=75?'g':sc>=50?'o':'r'; return `<div class="cev ${c}" onclick="open_('${x.id}')"><div class="t"><span>🕒 ${new Date(x.meet_at).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})}</span>${sc!=null?`<span>${sc}/100</span>`:''}</div><div class="nm">${esc(x.name||x.phone||'ליד')}</div><div class="m"><span>👤 ${esc(x.rep||'')}</span><span>${x.status==='pending'?'⏳ ממתין':esc((x.verdict||'').split(/[:.]/)[0].slice(0,14))}</span></div></div>`; }).join(''):'<div class="none">אין ראיונות</div>'}</div>`; }
  $('grid').innerHTML=h;
  if(ROLE==='admin'){ const p=$('pend'); if(PENDING.length){ p.style.display=''; p.innerHTML=`<h2>⏳ ממתינים לאישורך (${PENDING.length})</h2>`+PENDING.map(x=>`<div class="prow"><div><div class="who">${esc(x.name||x.phone||'ליד')} <span class="hint">· ${esc(x.rep||'')}</span> ${x.fit!=null?`<span class="chip ${x.fit>=75?'approved':x.fit>=50?'pending':'rejected'}">${x.fit}/100</span>`:''}</div><div class="sub">🕒 ${new Date(x.meet_at).toLocaleString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}${x.verdict?' · '+esc(x.verdict):''}${x.sent_at?' · ✉️ ההודעה נשלחה ללקוח':' · ✉️ ההודעה עוד לא נשלחה'}</div>${(()=>{ const f=x.form||{}; const p=[['job','עיסוק'],['budget','תקציב'],['why_now','למה עכשיו'],['commit','מחויבות']].filter(([k])=>String(f[k]||'').trim()).map(([k,l])=>`<b>${l}:</b> ${esc(String(f[k]).slice(0,60))}`); return p.length?`<div class="sub">${p.join(' · ')}</div>`:''; })()}</div><div class="acts"><button class="btn btn-sm" onclick="open_('${x.id}')">פרטים</button><button class="btn btn-sm g" onclick="decide('${x.id}','approved')">✅ אשר</button><button class="btn btn-sm r" onclick="decide('${x.id}','rejected')">❌ אין אישור</button><button class="btn btn-sm o" onclick="decide('${x.id}','moved')">↪️ עבר לאיש מכירות אחר</button></div></div>`).join(''); } else { p.style.display=''; p.innerHTML='<h2>✅ אין ראיונות שממתינים לאישור</h2>'; } }
  else $('pend').style.display='none';
  $('foot').textContent=ROLE==='admin'?'קווים מקווקווים = ממתין לאישור. מאושר צבוע לפי ההתאמה: ירוק 75+, כתום 50-74, אדום מתחת. לחיצה על כרטיס פותחת פרטים ומאפשרת לשנות החלטה.':'מוצגים רק ראיונות שמנהל המסלול אישר. צבע: ירוק 75+, כתום 50-74, אדום מתחת. לחיצה על כרטיס פותחת את הפרטים.';
}
window.open_=id=>{ const x=ROWS.find(r=>r.id===id)||PENDING.find(r=>r.id===id); if(!x) return; const f=x.form||{}; 
  const form=formTable(f); const wa=x.phone?'https://wa.me/'+String(x.phone).replace(/\D/g,'').replace(/^0/,'972'):'';
  $('box').innerHTML=`<div style="display:flex;align-items:center;gap:8px"><b style="font-size:16px">🎯 ${esc(x.name||x.phone||'ליד')}</b><span class="chip ${x.status}">${ST[x.status]||x.status}</span><span class="spacer"></span><button class="btn btn-sm" onclick="$('modal').classList.remove('show')">✕</button></div>
  <div class="card"><b>מועד הראיון</b>🕒 ${new Date(x.meet_at).toLocaleString('he-IL',{weekday:'long',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · נציג: ${esc(x.rep||'')}${wa?` · <a href="${wa}" target="_blank">🟢 ${esc(x.phone)}</a>`:''}${x.sent_at?'<br>✉️ הודעת האישור נשלחה ללקוח '+new Date(x.sent_at).toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'<br>✉️ הודעת האישור עוד לא נשלחה ללקוח'}</div>
  ${x.fit!=null?`<div class="card"><b>התאמה ${x.fit}/100</b>${esc(x.verdict||'')}</div>`:''}${x.summary?`<div class="card"><b>תמצית</b>${esc(x.summary)}</div>`:''}${x.note_to_manager?`<div class="card"><b>למנהל המסלול</b>${esc(x.note_to_manager)}</div>`:''}<div class="card"><b>📋 כל מה שהנציג מילא בטופס</b>${form}</div>
  ${(x.criteria||[]).length?`<div class="card"><b>5 המדדים של הנציג</b>${x.criteria.map((c,i)=>`${i+1}. ${esc(c.name)}: <b style="display:inline;color:var(--text)">${c.score}/20</b>`).join('<br>')}</div>`:''}
  ${x.manager_note?`<div class="card"><b>הערת המנהל</b>${esc(x.manager_note)}</div>`:''}
  ${ROLE==='admin'?`<div class="card"><b>החלטה</b><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><button class="btn btn-sm g" onclick="decide('${x.id}','approved')">✅ אשר</button><button class="btn btn-sm r" onclick="decide('${x.id}','rejected')">❌ אין אישור</button><button class="btn btn-sm o" onclick="decide('${x.id}','moved')">↪️ עבר לאיש מכירות אחר</button><button class="btn btn-sm" onclick="decide('${x.id}','pending')">⏳ החזר להמתנה</button></div><input id="note" placeholder="הערה (לא חובה)" value="${esc(x.manager_note||'')}" style="font:inherit;width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--border);border-radius:8px"></div>`:''}`;
  $('modal').classList.add('show'); };
window.decide=async(id,status)=>{ try{ const note=$('note')?$('note').value.trim():''; await api('/cal/decide',{method:'POST',body:JSON.stringify({id,status,note})}); toast(status==='approved'?'אושר, נכנס ליומן':status==='pending'?'הוחזר להמתנה':'סומן: '+ST[status]); $('modal').classList.remove('show'); await load(); }catch(e){ toast('שגיאה: '+e.message); } };
async function enter(){ PW=$('pw').value.replace(/[^0-9A-Za-z]/g,''); if(!PW) return; $('enter').disabled=true; $('enter').textContent='בודק…'; $('gateErr').textContent=''; try{ await load(); sessionStorage.setItem('cal_pw',PW); $('gate').style.display='none'; $('app').style.display=''; }catch(e){ $('gateErr').textContent=e.message; } finally{ $('enter').disabled=false; $('enter').textContent='כניסה'; } }
$('enter').onclick=enter; $('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') enter(); });
$('prev').onclick=()=>{ WEEK--; load().catch(e=>toast(e.message)); }; $('next').onclick=()=>{ WEEK++; load().catch(e=>toast(e.message)); }; $('today').onclick=()=>{ WEEK=0; load().catch(e=>toast(e.message)); }; $('reload').onclick=()=>load().then(()=>toast('עודכן')).catch(e=>toast(e.message));
$('logout').onclick=()=>{ sessionStorage.removeItem('cal_pw'); location.reload(); };
(async()=>{ const saved=sessionStorage.getItem('cal_pw'); if(saved){ $('pw').value=saved; await enter(); } })();
setInterval(()=>{ if(ROLE) load().catch(()=>{}); },60000);
</script>
</body>
</html>
