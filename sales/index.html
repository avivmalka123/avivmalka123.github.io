<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important} #gate{position:fixed;inset:0;z-index:999;background:#0c0b09;display:grid;place-items:center;font-family:Heebo,Arial,sans-serif;color:#f4eee3}
#gate form{display:grid;gap:12px;text-align:center;width:min(320px,90vw)} #gate h1{margin:0;font-size:26px} #gate input{font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;padding:12px;border-radius:12px;border:1px solid #3d362a;background:#1c1914;color:#f4eee3}
#gate button{font:inherit;font-weight:800;font-size:17px;padding:12px;border:0;border-radius:12px;background:#f2b544;color:#1b1306;cursor:pointer} #gate .err{color:#ef6a5a;min-height:1.4em;margin:0}
body.locked #app{display:none}</style>
</head><body class="locked">
<div id="gate"><form id="gateForm"><h1>מרכז המכירות</h1><span style="color:#a69d8b">הכנס קוד גישה</span><input id="gateCode" inputmode="numeric" autocomplete="off" aria-label="קוד גישה" autofocus><button>כניסה</button><p class="err" id="gateErr"></p></form></div>
<script>(function(){var ok=function(){document.body.classList.remove('locked');var g=document.getElementById('gate');if(g)g.remove();};
try{if(localStorage.getItem('sc_gate')==='1'){ok();return;}}catch(e){}
document.getElementById('gateForm').addEventListener('submit',function(e){e.preventDefault();if(document.getElementById('gateCode').value.trim()==='1234'){try{localStorage.setItem('sc_gate','1')}catch(e){};ok();setTimeout(function(){window.fitAll&&fitAll()},50);}else{document.getElementById('gateErr').textContent='קוד שגוי';}});})();</script>
<title>מרכז המכירות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* layout: sticky control bar · steps rail (right, RTL) · stage · client card (left). Screen-share mode = stage only. */
:root{
  --ink:#0c0b09; --panel:#15130f; --panel-2:#1c1914; --panel-3:#241f18; --line:#2e2920; --line-2:#3d362a;
  --text:#f4eee3; --muted:#a69d8b; --dim:#7a7264;
  --gold:#f2b544; --gold-2:#ffd98a; --gold-3:#b9832a; --gold-ink:#1b1306;
  --rep:#86c4ff; --rep-bg:#0e1824; --rep-line:#1f3550;
  --good:#5fd08a; --warn:#f2a33a; --bad:#ef6a5a;
  --f-display:'Heebo','Arial Hebrew',Arial,sans-serif;
  --f-body:'Heebo','Arial Hebrew',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--text)}
body{font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ───────── top bar ───────── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--gold-2),var(--gold) 55%,var(--gold-3));display:grid;place-items:center;color:var(--gold-ink);font-weight:900;font-size:15px;box-shadow:0 0 0 1px #00000040 inset}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.1}
.phases{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;margin-inline-start:auto}
.phase{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500;font-size:14px;display:flex;gap:7px;align-items:center;white-space:nowrap}
.phase .tag{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid currentColor;opacity:.8}
.phase[aria-pressed="true"]{background:var(--panel-3);color:var(--text)}
.phase[data-p="b"][aria-pressed="true"]{background:var(--gold);color:var(--gold-ink)}
.phase[data-p="b"][aria-pressed="true"] .tag{border-color:var(--gold-ink)}
.tools{display:flex;gap:8px;align-items:center}
.timer{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px}
.timer .mono{font-size:15px;min-width:52px;text-align:center}
.timer-bar{width:70px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--good);width:0}
.timer-bar.over i{background:var(--bad)}
.ib{border:1px solid var(--line-2);background:var(--panel-2);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{border-color:var(--gold-3)}
.ib.gold{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.ib.rep{background:var(--rep-bg);border-color:var(--rep-line);color:var(--rep)}
.ib.sm{padding:3px 10px;font-size:13px}

/* ───────── layout ───────── */
.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 330px;gap:0;min-height:calc(100vh - 60px)}
.rail{border-inline-start:0;border-inline-end:1px solid var(--line);padding:18px 12px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
.rail h4{margin:4px 8px 10px;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail button{width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;color:var(--muted);font-size:14px;line-height:1.3}
.rail button .n{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-family:var(--f-mono)}
.rail button.done .n{background:var(--panel-3);color:var(--good);border-color:#2c5a3d}
.rail button[aria-current="true"]{background:var(--panel-2);color:var(--text)}
.rail button[aria-current="true"] .n{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.stage{min-width:0;padding-block:26px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage-in{max-width:960px;margin-inline:auto}
.side{border-inline-start:1px solid var(--line);position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto;padding:16px 14px 40px;background:var(--panel)}

/* rep-only zones */
.rep{background:var(--rep-bg);border:1px solid var(--rep-line);border-radius:var(--r);padding:16px 18px;position:relative}
.rep-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--rep);font-weight:500;letter-spacing:.02em}
.rep-flag::before{content:"";width:8px;height:8px;border-radius:2px;background:repeating-linear-gradient(45deg,var(--rep) 0 2px,transparent 2px 4px)}

/* ───────── rep step ───────── */
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.03em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .pill{border:1px solid var(--line-2);border-radius:99px;padding:1px 9px}
.step-h{display:grid;gap:10px;margin-bottom:22px}
.step-h h1{font-size:clamp(28px,3.4vw,40px);font-weight:800}
.goal{font-size:18px;color:var(--gold-2);margin:0;max-width:65ch}
.blocks{display:grid;gap:14px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.blk h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;color:var(--text)}
.blk h3 .k{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line-2);border-radius:99px;padding:0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer;padding:4px 0}
.checks input{width:18px;height:18px;margin-top:3px;accent-color:var(--good)}
.checks input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:#ffffff40}
.say{display:grid;gap:10px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-inline-start:3px solid var(--gold);border-radius:10px;padding:12px 14px;font-size:17px;line-height:1.65}
.line .cp{opacity:.55;border:0;background:transparent;font-size:12px;color:var(--muted);padding:2px 4px}
.line .cp:hover{opacity:1}
.ask{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ask button{width:100%;text-align:start;border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 12px 10px 14px;display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;font-size:16px;line-height:1.55}
.ask button::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);margin-top:5px}
.ask button[aria-pressed="true"]{color:var(--muted);border-color:#2c5a3d}
.ask button[aria-pressed="true"]::before{background:var(--good);border-color:var(--good)}
.ask .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ul{margin:0;padding-inline-start:20px;display:grid;gap:5px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs > div{border-radius:10px;padding:12px 14px;font-size:15px;border:1px solid var(--line)}
.vs .weak{background:#2a1512;border-color:#4a2620}
.vs .strong{background:#122318;border-color:#244a33}
.vs b{display:block;font-size:12px;letter-spacing:.05em;margin-bottom:4px}
.vs .weak b{color:var(--bad)} .vs .strong b{color:var(--good)}
.gate{display:flex;gap:12px;align-items:flex-start;border:1px dashed var(--gold-3);border-radius:var(--r);padding:14px 16px;color:var(--gold-2);background:#1d160a}
.gate b{white-space:nowrap}
.silence{display:flex;gap:14px;align-items:center;border-radius:var(--r);padding:14px 18px;background:linear-gradient(90deg,#1b1206,#221808);border:1px solid var(--gold-3)}
.silence .big{font-size:28px;font-weight:900;color:var(--gold)}
.ph{color:var(--rep);background:#0f2033;border:1px dashed #2b4a6c;border-radius:6px;padding:0 6px;font-size:.9em;white-space:nowrap}
.v{color:var(--gold-2);font-weight:600}
.quizrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.quizrow dt{color:var(--muted)} .quizrow dd{margin:0}
.flow-mini{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow-mini span{background:var(--panel-2);border:1px solid var(--line-2);border-radius:99px;padding:6px 14px;font-weight:500}
.flow-mini i{color:var(--gold);font-style:normal}
.lights{display:flex;gap:8px;flex-wrap:wrap}
.light{border:1px solid var(--line-2);background:var(--panel-2);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;text-align:start}
.light .dot{width:14px;height:14px;border-radius:50%}
.light[aria-pressed="true"]{border-color:var(--gold);background:var(--panel-3)}
.reco{margin-top:10px;font-size:15px;color:var(--gold-2)}
.gapbox{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.gapbox textarea{width:100%;min-height:110px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;resize:vertical;line-height:1.5}
.gapbox .arrow{display:grid;place-items:center;color:var(--gold);font-size:26px}
.gapbox label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.meter{display:grid;gap:6px;margin-top:12px}
.meter input{width:100%;accent-color:var(--gold)}
.bridge{font-size:19px;line-height:1.8;background:var(--panel-2);border:1px solid var(--line-2);border-radius:var(--r);padding:18px 20px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big-btn{border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-size:17px;background:linear-gradient(145deg,var(--gold-2),var(--gold));color:var(--gold-ink);box-shadow:0 10px 30px -12px #f2b54499}
.obj{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);overflow:hidden}
.obj > button{width:100%;border:0;background:transparent;text-align:start;padding:14px 16px;display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px}
.obj > button .q{flex:1}
.obj > button .chev{color:var(--muted);transition:transform .2s}
.obj[open-state="1"] > button .chev{transform:rotate(180deg)}
.obj .body{padding:0 16px 16px;display:grid;gap:10px}
.obj .lab{font-size:12px;color:var(--muted);letter-spacing:.05em}
.obj .used{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
.search{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.summary-out{width:100%;min-height:260px;background:var(--panel-2);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;font-family:var(--f-body);line-height:1.6;white-space:pre-wrap}
.outcomes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.steps-num{display:grid;gap:10px;counter-reset:s}
.steps-num > div{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.steps-num > div::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--panel-3);border:1px solid var(--gold-3);color:var(--gold);display:grid;place-items:center;font-family:var(--f-mono);font-size:14px}
.warnbox{border:1px solid #5a3b14;background:#1f1508;color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px}

/* ───────── client card ───────── */
.side h2{font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side .sec{margin-top:16px;display:grid;gap:9px}
.side .sec > b{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.fld{display:grid;gap:3px}
.fld span{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:7px 10px;font-size:14px}
.fld textarea{min-height:64px;resize:vertical;line-height:1.45}
.fld select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:12px 55%,7px 55%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:10px;padding-inline-end:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#2a2112;border:1px solid var(--gold-3);color:var(--gold-2);border-radius:99px;padding:2px 10px;font-size:13px}
.side .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.side details summary{cursor:pointer;color:var(--muted);font-size:13px}
.side-close{display:none}

/* ───────── client slides (share-safe) ───────── */
.slide{display:grid;gap:22px}
.slide-h{display:grid;gap:10px}
.kicker{color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.08em}
.slide-h h1{font-size:clamp(30px,4.4vw,54px);font-weight:900;letter-spacing:-.01em}
.slide-h h1 em{font-style:normal;color:var(--gold)}
.lead{font-size:clamp(17px,1.8vw,21px);color:#d9d1c2;max-width:62ch;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.heard{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.heard .c{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:8px;align-content:start}
.heard .c b{font-size:13px;color:var(--gold);letter-spacing:.05em}
.heard .c p{margin:0;font-size:20px;line-height:1.5}
.heard .c.goalc{background:linear-gradient(160deg,#2a1f0c,#17120a);border-color:var(--gold-3)}
.agree{font-size:26px;font-weight:800;text-align:center;color:var(--gold-2)}
.disclaim{font-size:13px;color:var(--dim)}
.navbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border:1px solid var(--line-2);border-radius:999px;padding:6px}
.navbar button{border:0;background:var(--panel-3);border-radius:999px;padding:8px 16px;font-weight:600}
.navbar .next{background:var(--gold);color:var(--gold-ink)}
.navbar .pos{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-inline:8px}
.dots{display:flex;gap:5px;padding-inline:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--gold);width:18px;border-radius:4px}

/* B1: money flow 3D */
.flow3d{perspective:1300px;padding:10px 0 4px}
.flow-track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;transform:rotateX(24deg);transform-style:preserve-3d}
.node{position:relative;background:linear-gradient(170deg,var(--panel-3),var(--panel));border:1px solid var(--line-2);border-radius:16px;padding:16px 12px 14px;text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .3s,box-shadow .3s;transform:translateZ(0);box-shadow:0 18px 28px -18px #000}
.node .ico{font-size:13px;font-family:var(--f-mono);color:var(--gold);display:block;margin-bottom:6px}
.node b{display:block;font-size:16px;line-height:1.3}
.node small{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.35}
.node.on{transform:translateZ(46px);border-color:var(--gold);box-shadow:0 30px 40px -20px #f2b54470}
.node::after{content:"";position:absolute;inset-inline-start:-12px;top:50%;width:12px;height:2px;background:var(--line-2)}
.node:first-child::after{display:none}
.calc{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:stretch}
.calc .ins{display:grid;gap:12px}
.calc label{display:grid;gap:4px;font-size:14px;color:var(--muted)}
.calc .rng{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center}
.calc input[type=range]{accent-color:var(--gold);width:100%}
.calc input[type=number]{background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;width:100%;font-family:var(--f-mono)}
.calc .out{background:linear-gradient(160deg,#2a1f0c,#120e08);border:1px solid var(--gold-3);border-radius:16px;padding:18px;display:grid;gap:10px;align-content:center;text-align:center}
.calc .out .n{font-size:clamp(38px,5vw,58px);font-weight:900;color:var(--gold);line-height:1;font-family:var(--f-display)}
.calc .out .s{color:#d9d1c2;font-size:15px}
.calc .sep{height:1px;background:var(--line-2);margin:4px 0}

/* 3D iso stairs */
.fitbox{width:100%;display:grid;place-items:center;overflow:hidden}
.fit{transform-origin:top center}
.iso-scene{width:620px;height:360px;perspective:1600px;position:relative}
.iso{position:absolute;left:50%;top:58%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(58deg) rotateZ(38deg)}
.box{position:absolute;transform-style:preserve-3d;cursor:pointer}
.box .f{position:absolute;display:block}

/* ═════════ helpers for slides ═════════ */
function rng(id,label,v,min,max,step){ return `<label for="${id}">${label}<span class="rng"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><input type="number" id="${id}n" min="${min}" max="${max}" step="${step}" value="${v}" aria-label="${label}"></span></label>`; }
function journey(on){ const st=[['שלב 1','הקורס הדיגיטלי','מהיום הראשון'],['שלב 2','מועדון המתקדמים','נפתח אחרי 10 מכירות'],['שלב 3','פגישה עם אביב','נפתח אחרי ₪5,000']];
  return `<div class="journey">${st.map((s,i)=>`<div class="${i===on?'on':''}"><span class="lock">${s[0]}</span><b>${s[1]}</b><small>${s[2]}</small></div>`).join('')}</div>`; }
function matchHtml(){
  const map={'לא ידעתי מאיפה מתחילים, אז לא התחלתי בכלל':'מסלול 45 יום צעד אחר צעד','פחד להפסיד כסף':'ליווי בכל החלטה לפני שמוציאים שקל','ניסיתי לבד ונתקעתי':'מענה יומי בוואטסאפ וצוות מנטורים','תירצתי לעצמי שאין לי זמן, ודחיתי':'מסלול שבנוי לפי השעות שלך'};
  const rows=[]; const c=S.card;
  if(c.blocker&&map[c.blocker]) rows.push([c.blocker,map[c.blocker]]);
  if(c.missing) rows.push([c.missing,'שיטה, ליווי וקהילה שלא נותנת ליפול']);
  if(c.hours) rows.push(['יש לך '+c.hours+' בשבוע','תוכנית שבועית שמתאימה לזה']);
  if(!rows.length) return '';
  return `<div class="match"><b style="font-size:14px;color:var(--muted)">מה שאמרת שחסר לך ← מה שמחכה לך</b>${rows.map(r=>`<div><span class="from">${esc(r[0])}</span><span class="ar">←</span><span class="to">${esc(r[1])}</span></div>`).join('')}</div>`;
}

/* ═════════ render: rail ═════════ */
const PH={a:{list:A,name:'חלק א׳ · הכנה ואבחון'},b:{list:B,name:'חלק ב׳ · הצגת ההכשרה'},c:{list:C,name:'חלק ג׳ · סגירה'}};
const $=s=>document.querySelector(s);
function stepDone(p,i){ const l=PH[p].list[i]; const k=p+i; if(p==='b') return i<S.idx.b; const cs=(l.blocks||[]).find(b=>b.type==='check'); if(cs){ return cs.items.every((_,j)=>S.checks[k+'_'+j]); } return i<S.idx[p]; }
function renderRail(){
  const p=S.phase, list=PH[p].list;
  $('#rail').innerHTML=`<h4>${PH[p].name}</h4><ol>${list.map((s,i)=>`<li><button data-go="${i}" aria-current="${i===S.idx[p]}" class="${stepDone(p,i)?'done':''}"><span class="n">${p==='b'?(i===0?'·':i):i+1}</span><span>${esc(s.t)}</span></button></li>`).join('')}</ol>`;
  document.querySelectorAll('.phase').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===p)));
  $('#dots').innerHTML=list.map((_,i)=>`<i class="${i===S.idx[p]?'on':''}"></i>`).join('');
}

/* ═════════ render: blocks ═════════ */
function blk(b,k){
  const h=b.h?`<h3>${b.h}</h3>`:'';
  switch(b.type){
    case 'check': return `<div class="blk">${h}<ul class="checks">${b.items.map((it,j)=>`<li><label><input type="checkbox" data-chk="${k}_${j}" ${S.checks[k+'_'+j]?'checked':''}><span>${fill(it)}</span></label></li>`).join('')}</ul></div>`;
    case 'say': return `<div class="blk">${h}<div class="say">${b.lines.map(l=>`<div class="line"><span>${fill(l)}</span><button class="cp" data-copy>העתק</button></div>`).join('')}</div></div>`;
    case 'ask': return `<div class="blk">${h}<ul class="ask">${b.items.map((it,j)=>{const id=k+'_'+b.h+'_'+j;return `<li><button data-ask="${esc(id)}" aria-pressed="${!!S.asked[id]}"><span>${fill(it[0])}${it[1]?`<span class="why">${fill(it[1])}</span>`:''}</span></button></li>`;}).join('')}</ul></div>`;
    case 'watch': return `<div class="blk">${h}<ul class="ul">${b.items.map(i=>`<li>${fill(i)}</li>`).join('')}</ul></div>`;
    case 'tip': return `<div class="blk">${h}${fill(b.html)}</div>`;
    case 'html': return `<div class="blk" style="${b.h?'':'padding:0;border:0;background:transparent'}">${h}${fill(b.html)}</div>`;
    case 'versus': return `<div class="vs"><div class="weak"><b>נציג חלש</b>${fill(b.weak)}</div><div class="strong"><b>נציג חזק</b>${fill(b.strong)}</div></div>`;
    case 'quiz': return `<div class="blk">${h}<dl class="quizrow">${['stage','whyNow','job','age','hours','blocker','missing','ifNothing','business','budget','decider','ready'].map(q=>`<dt>${LABEL[q]}</dt><dd>${S.card[q]?esc(S.card[q]):'<span class="ph">לא מולא</span>'}</dd>`).join('')}</dl><p class="disclaim" style="margin:10px 0 0">ממלאים בכרטיס הלקוח (משמאל) מתוך הודעת הליד בקבוצה.</p></div>`;
    case 'gap': return `<div class="blk"><h3>הפער שלו, במילים שלו <span class="k">נשמר בכרטיס ומופיע לו על המסך בחלק ב׳</span></h3><div class="gapbox"><label for="gToday">היום<textarea id="gToday" data-card="today" placeholder="למשל: עובד 12 שעות, אין זמן לילדים, מרגיש תקוע">${esc(S.card.today||'')}</textarea></label><span class="arrow">←</span><label for="gFuture">בעוד שנה<textarea id="gFuture" data-card="future" placeholder="למשל: מנהל את היום שלי, אוסף את הילדים מהגן">${esc(S.card.future||'')}</textarea></label></div>
      <div class="meter"><label for="mPain" class="disclaim">כמה כואב לו להישאר במקום: <b class="mono" id="mPainV">${S.card.pain||5}</b>/10</label><input type="range" id="mPain" min="1" max="10" value="${S.card.pain||5}" data-card="pain"></div></div>`;
    case 'lights': {
      const L=[['g','var(--good)','ירוק: רוצה, יכול, מוכן'],['y','var(--warn)','צהוב: רוצה, אבל יש חשש אחד'],['r','var(--bad)','אדום: לא עכשיו / אין תקציב / לא מחליט']];
      const reco={g:'ממשיכים להצגה המלאה ולסגירה בשיחה הזאת.',y:'לפני ההצגה מוצאים את החשש. "מה הדבר האחד שעוצר אותך?" ומציגים בדגש עליו.',r:'לא מציגים הצגה מלאה. מכבדים, מציעים את המסלול החינמי (קורס חינם / קבוצה) וקובעים שיחת המשך עם תאריך.'};
      return `<div class="blk"><h3>רמזור מוכנות</h3><div class="lights">${L.map(l=>`<button class="light" data-light="${l[0]}" aria-pressed="${S.light===l[0]}"><span class="dot" style="background:${l[1]}"></span>${l[2]}</button>`).join('')}</div>${S.light?`<p class="reco">${reco[S.light]}</p>`:''}</div>`; }
    case 'bridge': return `<div class="blk"><h3>הגשר: מסכמים במילים שלו <span class="k">נבנה אוטומטית מהכרטיס</span></h3><div class="bridge">${fill('אז אם אני מסכם: אתה {job}, ואתה היום {today}. ניסית {tried}, ומה שעצר אותך זה {blocker}. מה שהכי חסר לך זה {missing}. ואתה רוצה להגיע ל{goalMoney} בחודש, כדי {goalWhy}. דייקתי?')}</div></div>`;
    case 'objs': return `<div class="blk" style="background:transparent;border:0;padding:0"><input class="search" id="objSearch" placeholder="חיפוש התנגדות: יקר, לחשוב, זמן..." aria-label="חיפוש התנגדות"><div style="display:grid;gap:10px" id="objList">${OBJ.map((o,i)=>`<div class="obj" data-oi="${i}" open-state="0"><button data-otog="${i}"><span class="q">"${esc(o.q)}"</span><span class="used"><input type="checkbox" data-oused="${i}" ${S.objUsed[i]?'checked':''} aria-label="עלתה בשיחה"> עלתה</span><span class="chev">⌄</span></button><div class="body" hidden><div><div class="lab">מה זה בדרך כלל אומר</div>${esc(o.means)}</div><div><div class="lab">שואלים (לא מתווכחים)</div><ul class="ask">${o.ask.map(a=>`<li><button aria-pressed="false" data-asktmp><span>${fill(a)}</span></button></li>`).join('')}</ul></div><div class="say">${o.say.map(l=>`<div class="line"><span>${fill(l)}</span><button class="cp" data-copy>העתק</button></div>`).join('')}</div>${o.show?`<div><button class="ib" data-jump="b:${B.findIndex((_,j)=>'b'+j===o.show)}">הראה על המסך</button></div>`:''}</div></div>`).join('')}</div></div>`;
    case 'offerwarn': { const miss=['price','payments','guarantee','payLink'].filter(k=>!offer(k)); return miss.length?`<div class="warnbox">חסר בהגדרות ההצעה: ${miss.map(k=>({price:'מחיר',payments:'אפשרויות תשלום',guarantee:'תנאי התחייבות',payLink:'לינק תשלום'}[k])).join(', ')}. ממלאים בכרטיס הלקוח למטה (הגדרות הצעה), או שאביב מעדכן בקובץ.</div>`:''; }
    case 'paylink': return `<div class="blk"><h3>לינק התשלום</h3>${offer('payLink')?`<div class="line"><span class="mono" style="font-size:14px;word-break:break-all">${esc(offer('payLink'))}</span><button class="cp" data-copy>העתק</button></div>`:'<div class="warnbox">אין עדיין לינק תשלום. ממלאים בהגדרות ההצעה.</div>'}</div>`;
    case 'summary': return `<div class="blk"><h3>איך נגמרה השיחה</h3><div class="outcomes">${[['closed','נסגר'],['follow','שיחת המשך'],['no','לא מתאים כרגע']].map(o=>`<button class="light" data-out="${o[0]}" aria-pressed="${S.outcome===o[0]}">${o[1]}</button>`).join('')}</div>
      ${S.outcome==='follow'?`<div class="fld" style="margin-bottom:10px"><span>מתי שיחת ההמשך (יום ושעה מדויקים)</span><input id="followIn" value="${esc(S.follow)}" placeholder="למשל: יום שלישי 20:30"></div>`:''}
      ${S.outcome==='no'?`<div class="fld" style="margin-bottom:10px"><span>הסיבה</span><input id="followIn" value="${esc(S.follow)}" placeholder="למשל: אין תקציב כרגע, הופנה לקורס החינמי"></div>`:''}
      <textarea class="summary-out" id="sumOut" readonly aria-label="סיכום שיחה">${esc(summaryText())}</textarea>
      <div class="cta-row" style="margin-top:10px"><button class="big-btn" data-copysum>העתק סיכום לפיירברי</button><button class="ib" data-reset>שיחה חדשה (איפוס)</button></div><div id="resetConfirm"></div></div>`;
  }
  return '';
}
function summaryText(){
  const c=S.card, o={closed:'נסגר',follow:'שיחת המשך',no:'לא מתאים כרגע'}[S.outcome]||'—';
  const objs=OBJ.filter((_,i)=>S.objUsed[i]).map(x=>x.q).join(', ')||'—';

שם: ${L('name')}
תוצאה: ${o}${S.follow?' · '+S.follow:''}
רמזור: ${({g:'ירוק',y:'צהוב',r:'אדום'})[S.light]||'—'}

מצב היום: ${L('stage')}
עיסוק: ${L('job')} · גיל: ${L('age')}
למה עכשיו: ${L('whyNow')}
מה ניסה: ${L('tried')}
מה עצר: ${L('blocker')}
מה חסר: ${L('missing')}
ממה חושש: ${L('fear')}
היום, במילים שלו: ${L('today')}
בעוד שנה: ${L('future')}
יעד חודשי: ${c.goalMoney?'₪'+c.goalMoney:'—'} · למה: ${L('goalWhy')}

משפטים שלו: ${(c.words||'—').split('\n').filter(Boolean).join(' | ')}

}

/* ═════════ render: stage ═════════ */
function renderStage(){
  const p=S.phase, i=S.idx[p], share=document.body.classList.contains('share');
  const st=$('#stage');
  if(share && p!=='b'){
    st.innerHTML=`<div class="cover"><div><div class="brand-mark mk">א</div><h1>${S.card.name?esc(S.card.name)+', ':''}נעים להכיר</h1><p>מועדון האיקומרס של אביב מלכה</p></div></div>`;
    return;
  }
  if(p==='b'){
    const s=B[i];
    st.innerHTML=`<section class="slide">${s.html()}</section>
      <div class="rep" style="margin-top:26px"><span class="rep-flag">אזור הנציג: לא מופיע בשיתוף מסך</span>
        <div class="say" style="margin-top:10px">${s.rep.say.map(l=>`<div class="line"><span>${fill(l)}</span><button class="cp" data-copy>העתק</button></div>`).join('')}</div>
        <p style="margin:12px 0 0"><b style="color:var(--rep)">שאלת הסכמה קטנה:</b> ${fill(s.rep.ask)}</p>
        ${s.rep.tip?`<p class="disclaim" style="margin:8px 0 0">${fill(s.rep.tip)}</p>`:''}
        ${i===B.length-1?`<div class="cta-row" style="margin-top:12px"><button class="ib rep" data-act="toC">לחלק ג׳: סגירה</button></div>`:''}
      </div>`;
    afterSlide(i);
  } else {
    const list=PH[p].list, s=list[i], k=p+i;
    st.innerHTML=`<article><header class="step-h"><div class="eyebrow"><span class="rep-flag">נציג בלבד</span><span>${PH[p].name}</span><span class="pill">שלב ${i+1} מתוך ${list.length}</span><span class="pill mono">${s.time}</span></div><h1>${esc(s.t)}</h1><p class="goal">${fill(s.goal)}</p></header>
      <div class="blocks">${s.blocks.map(b=>blk(b,k)).join('')}<div class="gate"><b>שער מעבר:</b><span>${fill(s.gate)}</span></div></div></article>`;
    if(p==='c'&&i===0) renderTemp();
    if(p==='c'&&i===3) renderGuar();
  }
  $('#prevBtn').disabled = (p==='a'&&i===0);
  window.scrollTo({top:0});
}
function renderTemp(){ const r=S.card.ready||''; const box=$('#tempBox'); if(!box) return;
  const m=r.match(/\((\d+)%\)/); const pct=m?+m[1]:null;
  box.innerHTML = pct==null?'<span class="ph">לא מולא בשאלון</span>':`<div class="meter"><span>בשאלון: "${esc(r)}"</span><span class="money-bar"><i style="width:${pct}%"></i></span><span class="disclaim">${pct>=90?'חם. לרוב אפשר לסגור בשיחה הזאת.':pct>=50?'פושר. לפני המחיר מוצאים מה חסר ל־100%.':'קר. בודקים מוכנות בעדינות, ולא נלחצים לסגור.'}</span></div>`; }
function renderGuar(){ const b=$('#guarBox'); if(!b) return; b.innerHTML = offer('guarantee')?`<p style="margin:0">${esc(offer('guarantee'))}</p><p class="disclaim" style="margin:6px 0 0">אומרים רק מה שכתוב בהסכם. לא מוסיפים ולא מפרשים.</p>`:'<div class="warnbox">תנאי ההתחייבות עוד לא הוגדרו. עד שאביב מאשר נוסח: "את כל התנאים תקבל כתובים בהסכם, ואני אעבור עליהם איתך עכשיו."</div>'; }

/* ═════════ slide behaviours ═════════ */
let timers=[];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t);}); timers=[]; }
function afterSlide(i){
  clearTimers(); fitAll();
  if(i===1){ // flow + calc
    const nodes=[...document.querySelectorAll('#flow .node')]; let n=0;
    const tick=()=>{ nodes.forEach((x,j)=>x.classList.toggle('on',j===n)); n=(n+1)%nodes.length; };
    tick(); timers.push(setInterval(tick,1400));
    ['cPrice','cCost','cAds','cGoal'].forEach(id=>{ const r=$('#'+id), nb=$('#'+id+'n');
      r.addEventListener('input',()=>{nb.value=r.value;calc();}); nb.addEventListener('input',()=>{r.value=nb.value;calc();}); });
    calc();
  }
  if(i===2) buildStairs();
  if(i===3) buildCar();
  if(i===4) skills();
  if(i===6) vault();
  if(i===7){ timers.push(setTimeout(()=>{ const b=$('#mBar'); if(b) b.style.width='100%'; },200)); let v=0; const t=setInterval(()=>{ v=Math.min(5000,v+125); const n=$('#mNum'); if(n) n.textContent='₪'+v.toLocaleString('he-IL'); if(v>=5000) clearInterval(t); },50); timers.push(t); }
  if(i===8) wall();
  if(i===9) week();
}
function calc(){
  const g=id=>Number($('#'+id).value)||0;
  const price=g('cPrice'), cost=g('cCost'), ads=g('cAds'), goal=g('cGoal');
  const profit=Math.round(price-cost-ads-price*0.03);
  const out=$('#calcOut');
  if(profit<=0){ out.innerHTML=`<span class="s">רווח להזמנה</span><span class="n" style="color:var(--bad)">₪${profit}</span><div class="sep"></div><span class="s">במחיר הזה אין רווח. בגלל זה בוחרים מוצר ומחיר נכון כבר בהתחלה, וזה בדיוק מה שלומדים בשלב הראשון.</span>`; return; }
  const perMonth=Math.ceil(goal/profit), perDay=(perMonth/30);
  out.innerHTML=`<span class="s">רווח להזמנה</span><span class="n">₪${profit}</span><div class="sep"></div><span class="s">כדי להגיע ל־₪${goal.toLocaleString('he-IL')} רווח בחודש צריך בערך</span><span class="n mono" style="font-size:40px">${perMonth}</span><span class="s">הזמנות בחודש · כ־${perDay<1?perDay.toFixed(1):Math.round(perDay*10)/10} ביום</span>`;
}
const STAIRS=[['ימים 1–10','מחקר ומוצר','מחקר שוק ובחירת המוצר הראשון'],['ימים 11–25','חנות','הקמת החנות ודפי המוצר בעזרת AI'],['ימים 26–35','ספקים וקריאייטיב','ספק, תמונות, סרטונים ומסרים'],['ימים 36–45','השקה','קמפיין ראשון ומוכנות למכירות']];
function buildStairs(sel){
  const iso=$('#stairs'), lg=$('#stairLegend'); if(!iso) return;
  const cur=sel==null?(S.stair??3):sel; S.stair=cur;
  const W=104, Dp=150;
  iso.innerHTML=STAIRS.map((s,i)=>{ const h=40+i*42; return `<div class="box ${i<=cur?'':'dim'} ${i===cur?'on':''}" data-stair="${i}" style="--h:${h}px;width:${W}px;height:${Dp}px;left:${(i-2)*W}px;top:${-Dp/2}px"><i class="f s3"></i><i class="f s4"></i><i class="f s1"></i><i class="f s2"></i><i class="f tp">${i+1}</i></div>`; }).join('')
   + `<div class="flag" style="left:${2*W+30}px;top:-20px;transform:translateZ(${40+3*42}px)"></div>`;
  lg.innerHTML=STAIRS.map((s,i)=>`<button data-stair="${i}" aria-pressed="${i===cur}"><span class="d">${i+1}</span><span><span class="days">${s[0]}</span><b>${s[1]}</b><small>${s[2]}</small></span></button>`).join('')
   + `<div class="panel" style="padding:12px 14px;border-color:var(--gold-3)"><b style="color:var(--gold)">יום 45:</b> תשתית עסקית מוכנה למכירות</div>`;
}
const MODS=[['מחקר שוק','איך מוצאים מה אנשים כבר מחפשים וקונים, לפני שמשקיעים שקל.'],['בחירת מוצרים','הקריטריונים לבחירת מוצר, ואיך פוסלים מוצר מהר.'],['בניית חנות','חנות שופיפיי מקצועית, עם AI שעושה את העבודה הכבדה.'],['ספקים','איך בוחרים ספק, מזמינים דוגמה, ושולחים ללקוח בלי כאב ראש.'],['שיווק','קריאייטיבים, קמפיין ראשון, ואיך קוראים את המספרים.']];
let carI=0;
function buildCar(){ const car=$('#car'); if(!car) return; const R=280;
  car.innerHTML=MODS.map((m,i)=>`<div class="mod" style="transform:rotateY(${i*72}deg) translateZ(${R}px)"><span class="num">פרק ${i+1} מתוך 5</span><div><h3>${m[0]}</h3><p>${m[1]}</p></div><span class="hrs">שלב 1 · הקורס הדיגיטלי</span></div>`).join('');
  rotCar(); }
function rotCar(){ const car=$('#car'); if(car) car.style.transform=`translateZ(-280px) rotateY(${-carI*72}deg)`; }
function skills(){ const on=S.skills||{}; document.querySelectorAll('.skill').forEach(b=>b.setAttribute('aria-pressed',String(!!on[b.dataset.sk]))); upSk(); }
function upSk(){ const n=Object.values(S.skills||{}).filter(Boolean).length; const b=$('#skBar'); if(b){ b.style.width=(n/5*100)+'%'; $('#skNum').textContent=n+'/5'; } }
function vault(){ const v=$('#vault'), c=$('#vcnt'); if(!v) return; v.classList.remove('open'); let n=0; c.textContent='0';
  const t=setInterval(()=>{ n++; c.textContent=n; if(n>=10){ clearInterval(t); timers.push(setTimeout(()=>v.classList.add('open'),350)); } },220); timers.push(t); }
function wall(){ const tab=S.ptab||'all'; const w=$('#wall'); if(!w) return;
  w.innerHTML=PROOF.filter(p=>tab==='all'||p.c===tab).map(p=>`<button class="pcard" data-lb="${p.img}" data-cap="${esc(p.w+': '+p.t)}"><img src="${p.img}" alt="${esc(p.w)}" loading="lazy"><span class="cap"><b>${esc(p.t)}</b><span>${esc(p.w)}</span></span></button>`).join(''); }
function week(){ const w=$('#week'); if(!w) return;
  const hmap={'פחות מ־5 שעות':4,'5 עד 10 שעות':8,'10 עד 20 שעות':14,'יותר מ־20 שעות':20}; const H=hmap[S.card.hours]||8;
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const per=[0,1,2,3,4].map(()=>Math.floor((H-1)/5*2)/2); let rest=H-1-per.reduce((a,b)=>a+b,0); for(let i=0;rest>0.01;i=(i+1)%5){ per[i]+=.5; rest-=.5; }
  const kinds=['לימוד','ביצוע משימה','ביצוע משימה','לימוד','ביצוע משימה'];
  w.innerHTML=days.map((d,i)=>{ if(i===6) return `<div class="day rest"><b>${d}</b><span>מנוחה</span></div>`;
    if(i===5) return `<div class="day"><b>${d}</b><div class="blkd live">לייב שבועי<span>שעה</span></div></div>`;
    return `<div class="day"><b>${d}</b>${per[i]?`<div class="blkd">${kinds[i]}<span>${per[i]} ש׳</span></div>`:''}${i===2?`<div class="blkd live">שאלות בוואטסאפ<span>מענה מרוכז</span></div>`:''}</div>`; }).join('');
  if(!w.dataset.note){ w.insertAdjacentHTML('afterend',`<p class="disclaim" style="margin:0">סה״כ כ־${H} שעות בשבוע. היום של הלייב יכול להשתנות.</p>`); w.dataset.note=1; } }

/* ═════════ client card (side) ═════════ */
function sel(k){ return `<label class="fld"><span>${LABEL[k]}</span><select data-card="${k}" id="cf_${k}"><option value="">—</option>${Q[k].map(o=>`<option ${S.card[k]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`; }

function ta(k,ph){ return `<label class="fld"><span>${LABEL[k]}</span><textarea id="cf_${k}" data-card="${k}" placeholder="${ph||''}">${esc(S.card[k]||'')}</textarea></label>`; }
function renderSide(){
  const words=(S.card.words||'').split('\n').map(s=>s.trim()).filter(Boolean);
  $('#side').innerHTML=`<h2>כרטיס לקוח <span class="rep-flag">נציג</span><button class="ib sm side-close" id="sideClose">סגור</button></h2>
   <div class="sec"><b>מהשאלון</b>${inp('name','שם פרטי')}<div class="row2">${inp('job','במה עוסק')}${sel('age')}</div>${sel('stage')}${sel('whyNow')}${sel('hours')}${sel('blocker')}${ta('missing','מה כתב שחסר לו')}${sel('ifNothing')}${sel('business')}${sel('budget')}${sel('decider')}${sel('ready')}</div>
   <div class="sec"><b>מהשיחה</b>${ta('tried','מה ניסה, ומה קרה')}${ta('fear','ממה הוא הכי חושש')}<div class="row2">${inp('goalMoney','5000','number')}<span></span></div>${ta('goalWhy','מה הכסף הזה יאפשר לו')}${ta('threads','קצות חוט: טון, מילים, נקודות אדומות')}</div>
   <div class="sec"><b>המשפטים שלו (שורה לכל משפט)</b>${ta('words','"נמאס לי לעבוד בשביל מישהו אחר"')}${words.length?`<div class="chips">${words.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div>`:''}<span class="disclaim">חוק ההדהוד: בהצגה ובסגירה משתמשים במילים המדויקות שלו.</span></div>
   <div class="sec"><details><summary>הגדרות הצעה (מחיר, תשלומים, לינק)</summary><div style="display:grid;gap:8px;margin-top:8px">${['price','payments','guarantee','payLink'].map(k=>`<label class="fld"><span>${({price:'מחיר',payments:'אפשרויות תשלום',guarantee:'תנאי התחייבות',payLink:'לינק תשלום'})[k]}${OFFER[k]?' (נקבע בקובץ)':''}</span><input id="of_${k}" data-offer="${k}" value="${esc(offer(k))}" ${OFFER[k]?'disabled':''}></label>`).join('')}<span class="disclaim">נשמר רק בדפדפן הזה. הנוסח הקבוע: אביב מעדכן בקובץ.</span></div></details></div>`;
}

/* ═════════ timer ═════════ */
const TARGET={a:25,b:15,c:10};
function elapsed(){ return S.t.acc + (S.t.run? (Date.now()-S.t.start):0); }
function tick(){ const e=elapsed(); const m=Math.floor(e/60000), s=Math.floor(e/1000)%60; $('#tClock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const ps=S.phaseStart[S.phase]; const pe = ps!=null? (e-ps)/60000 : 0; const frac=Math.min(1,pe/TARGET[S.phase]);
  const bar=$('#tBar'); bar.querySelector('i').style.width=(frac*100)+'%'; bar.classList.toggle('over', pe>TARGET[S.phase]);
  bar.title=`${PH[S.phase].name}: ${Math.floor(pe)} מתוך ${TARGET[S.phase]} דק׳`; }
setInterval(tick,1000);
function tBtn(){ $('#tBtn').textContent = S.t.run?'עצור':(elapsed()?'המשך':'התחל שיחה'); }

/* ═════════ navigation ═════════ */
function go(p,i){ if(p!==S.phase){ S.phase=p; if(S.phaseStart[p]==null && (S.t.run||elapsed())) S.phaseStart[p]=elapsed(); }
  S.idx[p]=Math.max(0,Math.min(PH[p].list.length-1,i)); save(); renderRail(); renderStage(); }
function next(){ const p=S.phase,i=S.idx[p],L=PH[p].list.length; if(i<L-1) go(p,i+1); else if(p==='a') go('b',0); else if(p==='b') { setShare(false); go('c',0);} }
function prev(){ const p=S.phase,i=S.idx[p]; if(i>0) go(p,i-1); else if(p==='b') { setShare(false); go('a',A.length-1);} else if(p==='c') go('b',B.length-1); }
function setShare(on){ document.body.classList.toggle('share',on); $('#side').classList.remove('open'); renderStage(); }

/* ═════════ events ═════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-lb]'); if(!t) return;
  if(t.classList.contains('phase')){ go(t.dataset.p,S.idx[t.dataset.p]); return; }
  if(t.dataset.go!=null){ go(S.phase,+t.dataset.go); return; }
  if(t.id==='nextBtn') return next();
  if(t.id==='prevBtn') return prev();
  if(t.id==='shareBtn'){ if(S.phase!=='b') go('b',S.idx.b); setShare(true); return; }
  if(t.id==='unshareBtn') return setShare(false);
  if(t.id==='cardBtn'){ $('#side').classList.add('open'); return; }
  if(t.id==='sideClose'){ $('#side').classList.remove('open'); return; }
  if(t.id==='tBtn'){ if(S.t.run){ S.t.acc=elapsed(); S.t.run=false; } else { S.t.start=Date.now(); S.t.run=true; if(S.phaseStart[S.phase]==null) S.phaseStart[S.phase]=S.t.acc; } save(); tBtn(); tick(); return; }
  if(t.dataset.act==='toB'){ go('b',0); setShare(true); return; }
  if(t.dataset.act==='toC'){ setShare(false); go('c',0); return; }
  if(t.dataset.jump){ const [p,i]=t.dataset.jump.split(':'); go(p,+i); return; }
  if(t.dataset.ask!=null){ const id=t.dataset.ask; S.asked[id]=!S.asked[id]; t.setAttribute('aria-pressed',String(!!S.asked[id])); save(); return; }
  if(t.hasAttribute('data-asktmp')){ t.setAttribute('aria-pressed',String(t.getAttribute('aria-pressed')!=='true')); return; }
  if(t.dataset.light){ S.light=t.dataset.light; save(); renderStage(); return; }
  if(t.dataset.out){ S.outcome=t.dataset.out; save(); renderStage(); return; }
  if(t.dataset.otog!=null){ if(e.target.closest('[data-oused]')) return; const o=t.closest('.obj'); const b=o.querySelector('.body'); b.hidden=!b.hidden; o.setAttribute('open-state',b.hidden?'0':'1'); return; }
  if(t.hasAttribute('data-copy')){ const txt=t.previousElementSibling.innerText; copy(txt,t); return; }
  if(t.hasAttribute('data-copysum')){ copy($('#sumOut').value,t); return; }
  if(t.hasAttribute('data-reset')){ $('#resetConfirm').innerHTML=`<div class="warnbox" style="margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">למחוק את כרטיס הלקוח ואת כל הסימונים של השיחה הזאת? <button class="ib" data-reset-yes>כן, שיחה חדשה</button><button class="ib" data-reset-no>ביטול</button></div>`; return; }
  if(t.hasAttribute('data-reset-no')){ $('#resetConfirm').innerHTML=''; return; }
  if(t.hasAttribute('data-reset-yes')){ const keep=S.offerLocal; S={phase:'a',idx:{a:0,b:0,c:0},card:{},checks:{},asked:{},light:'',outcome:'',objUsed:{},follow:'',offerLocal:keep,t:{start:0,acc:0,run:false},phaseStart:{}}; save(); renderSide(); renderRail(); renderStage(); tBtn(); tick(); return; }
  if(t.dataset.stair!=null){ buildStairs(+t.dataset.stair); save(); return; }
  if(t.dataset.car){ carI=(carI+Number(t.dataset.car)+MODS.length)%MODS.length; rotCar(); return; }
  if(t.dataset.sk!=null){ S.skills=S.skills||{}; S.skills[t.dataset.sk]=!S.skills[t.dataset.sk]; t.setAttribute('aria-pressed',String(!!S.skills[t.dataset.sk])); upSk(); save(); return; }
  if(t.id==='vReplay') return vault();
  if(t.dataset.pt){ S.ptab=t.dataset.pt; document.querySelectorAll('#ptabs button').forEach(b=>b.setAttribute('aria-pressed',String(b===t))); wall(); save(); return; }
  if(t.dataset.lb){ const d=document.createElement('div'); d.className='lightbox'; d.innerHTML=`<div><img src="${t.dataset.lb}" alt=""><p>${esc(t.dataset.cap||'')}</p></div>`; d.addEventListener('click',()=>d.remove()); document.body.appendChild(d); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.chk){ S.checks[t.dataset.chk]=t.checked; save(); renderRail(); }
  if(t.dataset.oused!=null){ S.objUsed[t.dataset.oused]=t.checked; save(); }
});
let reT;
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.card){ S.card[t.dataset.card]=t.value; save();
    if(t.id==='mPain'){ $('#mPainV').textContent=t.value; return; }
    clearTimeout(reT); reT=setTimeout(()=>{ const inSide=t.closest('#side'); if(inSide && t.dataset.card==='words') renderSideKeep(t); if(!inSide||S.phase==='b') refreshStageKeep(); },350); }
  if(t.dataset.offer){ S.offerLocal=S.offerLocal||{}; S.offerLocal[t.dataset.offer]=t.value; save(); clearTimeout(reT); reT=setTimeout(refreshStageKeep,400); }
  if(t.id==='objSearch'){ const q=t.value.trim(); document.querySelectorAll('.obj').forEach(o=>{ const ob=OBJ[o.dataset.oi]; o.hidden = q && !(ob.q+' '+ob.means).includes(q); }); }
  if(t.id==='followIn'){ S.follow=t.value; save(); $('#sumOut').value=summaryText(); }
});
// re-render without stealing focus from the field being typed in
function refreshStageKeep(){ const a=document.activeElement; if(a && $('#stage').contains(a) && (a.tagName==='TEXTAREA'||a.tagName==='INPUT')) { const s=$('#sumOut'); if(s) s.value=summaryText(); return; } const y=scrollY; renderStage(); scrollTo(0,y); }
function renderSideKeep(t){ const id=t.id, pos=t.selectionStart; renderSide(); const n=document.getElementById(id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')) return;
  if(e.key==='ArrowLeft'||e.key===' '&&document.body.classList.contains('share')){ e.preventDefault(); next(); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); prev(); }
  else if(e.key==='s'||e.key==='S'||e.key==='ד'){ if(!document.body.classList.contains('share')&&S.phase!=='b') go('b',S.idx.b); setShare(!document.body.classList.contains('share')); }
  else if(e.key==='Escape'){ const lb=document.querySelector('.lightbox'); if(lb) lb.remove(); else setShare(false); }
  else if(['1','2','3'].includes(e.key)&&!document.body.classList.contains('share')) go('abc'[+e.key-1],S.idx['abc'[+e.key-1]]);
});
// proof cards: gentle 3D tilt
document.addEventListener('pointermove',e=>{ const c=e.target.closest&&e.target.closest('.pcard'); document.querySelectorAll('.pcard[data-tilt]').forEach(x=>{ if(x!==c){ x.style.removeProperty('--rx'); x.style.removeProperty('--ry'); x.removeAttribute('data-tilt'); } });
  if(!c||matchMedia('(prefers-reduced-motion:reduce)').matches) return; const r=c.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5; c.style.setProperty('--ry',(x*10)+'deg'); c.style.setProperty('--rx',(-y*10)+'deg'); c.setAttribute('data-tilt',''); });
function copy(txt,btn){ const done=()=>{ const o=btn.textContent; btn.textContent='הועתק'; setTimeout(()=>btn.textContent=o,1200); };
  try{ navigator.clipboard.writeText(txt).then(done).catch(()=>sel()); }catch(e){ sel(); }
  function sel(){ const r=document.createRange(); const n=btn.previousElementSibling||$('#sumOut'); if(n.select){ n.select(); } else { r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } btn.textContent='סמנתי, Ctrl+C'; } }
function fitAll(){ document.querySelectorAll('.fitbox').forEach(b=>{ const w=+b.dataset.w; const f=b.querySelector('.fit'); const s=Math.min(1,b.clientWidth/w); f.style.transform=`scale(${s})`; const inner=f.firstElementChild; b.style.height=(inner.offsetHeight*s)+'px'; }); }
addEventListener('resize',fitAll);

renderSide(); renderRail(); renderStage(); tBtn(); tick();
</script>

</body></html>
