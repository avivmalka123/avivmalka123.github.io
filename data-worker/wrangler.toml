name = "livecoach-data"
main = "src/index.js"
compatibility_date = "2026-01-15"

# Read-only bridge to ToChat + Fireberry for LiveCoach (rep app + manager board).
# Secrets (set once, never in git):
#   npx wrangler secret put TOCHAT_TENANT
#   npx wrangler secret put TOCHAT_API_KEY
#   npx wrangler secret put FIREBERRY_TOKEN
#   npx wrangler secret put APP_KEY        # shared key the apps send as x-app-key
#   npx wrangler secret put ANTHROPIC_API_KEY  # for the nightly preparation (Sonnet)
#   npx wrangler secret put SUPABASE_KEY   # the Supabase publishable key (same one the apps use) → webhook state lives in Supabase, not KV
[[kv_namespaces]]
binding = "CACHE"
id = "079622a22e9844c2aecec6136e1fba77"

[vars]
SUPABASE_URL = "https://vxbtazbmisgrfirdepej.supabase.co"

# every 4 minutes 18:00-19:59 UTC (21:00-22:59 Israel): one rep per run → day review + tomorrow's morning screen; 03:00-04:59 UTC (06:00-07:59 Israel): morning refresh
[triggers]
crons = ["*/4 18-19 * * *", "*/4 3-4 * * *"]
